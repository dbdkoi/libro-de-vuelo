<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Material GRUHEL</title>
<meta name="theme-color" content="#2f3b24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Material">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#eef0e8; --surface:#fff; --ink:#1b2114; --muted:#5d6650; --line:#d4d9c8;
  --accent:#3d4f2b; --accent-ink:#fff; --accent-soft:#e1e8d3; --head:#2f3b24;
  --ok:#1d7a4d; --ok-soft:#dcf1e6; --warn:#a85f00; --warn-soft:#fbebd0; --late:#b3261e; --late-soft:#f8dedb;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12160e; --surface:#1a2014; --ink:#e7eadf; --muted:#9aa38c; --line:#2c3423;
  --accent:#a9c47f; --accent-ink:#1a2210; --accent-soft:#283320; --head:#1d2516;
  --ok:#4cc38a; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#38290f; --late:#ff7a70; --late-soft:#3c1b19;
  color-scheme:dark;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.04em;text-transform:uppercase}
h2{font-size:21px} h3{font-size:15px;color:var(--muted);letter-spacing:.08em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.brand small{display:block;font:500 10px var(--body);letter-spacing:.14em;color:#c9d3b6;margin-top:2px}
#pill{font:600 12px var(--body);letter-spacing:.04em;padding:6px 11px;border-radius:99px;background:#dcf1e6;color:#145c39;white-space:nowrap;border:0;min-height:0}
#pill.pend{background:#fbebd0;color:#7a4500} #pill.err{background:#f8dedb;color:#8f1d17}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;text-decoration:none;color:var(--muted);font:600 11px var(--body);letter-spacing:.02em}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current=page]{color:var(--accent)}
nav.tabs a .dot{position:absolute;top:4px;left:50%;margin-left:7px;background:var(--late);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.tri{display:inline-block;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--late);position:relative;vertical-align:-2px;flex:0 0 auto}
.tri::after{content:"!";position:absolute;left:-3px;top:2px;color:#fff;font:700 11px/14px var(--body);width:6px;text-align:center}
nav.tabs a .tri{position:absolute;top:3px;left:50%;margin-left:6px;transform:scale(.85)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.hint{color:var(--muted);font-size:13px}
.sites{display:grid;gap:10px}
.site{border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:8px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.site.warn{border-left-color:var(--warn)} .site.late{border-left-color:var(--late)} .site.n{border-left-color:var(--line)}
.site .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.site .t b{font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.site .meta{font-size:13px;color:var(--muted)}
.falta{font-size:13px;color:var(--late);font-weight:600}
.tag{display:inline-block;font:600 11px var(--body);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.late{background:var(--late-soft);color:var(--late)} .tag.n{background:transparent;border:1px solid var(--line);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:var(--surface)}
.stat .v{font:600 26px var(--mono)} .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:center;padding:10px;border-radius:6px;background:var(--warn-soft);font-size:14px;cursor:pointer}
.alert.late{background:var(--late-soft)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big.tres{grid-template-columns:repeat(3,1fr);gap:8px}
.big button{min-height:56px;font-size:15px}
.big.tres button{font-size:13.5px;padding:8px 4px;line-height:1.2}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.ph{width:60px;height:60px;border-radius:6px;flex:0 0 60px;background:#fff;border:1px solid var(--line);display:block;object-fit:contain}
.ph.s{width:48px;height:48px;flex-basis:48px}
div.ph{background:var(--accent-soft)}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;font-size:14px;line-height:1.25}
.item .sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;align-items:center}
.item .id{font:600 12px var(--mono);color:var(--muted)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border-radius:99px;min-height:38px;padding:6px 13px;font-size:13px}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button[aria-pressed=true] .hint{color:inherit;opacity:.8}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-height:46px}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;flex:0 0 22px;accent-color:var(--accent);margin:0}
label{display:block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
label.ck{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font:500 15px var(--body);color:var(--ink);padding:6px 0;margin:6px 0 0}
button{font:600 14px var(--body);cursor:pointer;border-radius:6px;padding:9px 14px;min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);touch-action:manipulation}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--late);border-color:var(--late)}
button.small{min-height:36px;padding:5px 11px;font-size:13px}
button.w{width:100%;margin-top:12px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:38px;border-radius:99px;font-size:13px;padding:6px 13px;flex:0 0 auto}
.check{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.check .main{flex:1;min-width:0;font-size:14px}
.tog{display:flex;gap:6px}
.tog button{min-height:48px;min-width:52px;padding:4px 8px;font-size:18px}
.tog button.on.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.tog button.on.nob{background:var(--late);border-color:var(--late);color:#fff}
.step{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.step button{min-width:46px;padding:0;font-size:20px}
.step input{width:58px;text-align:center;padding:9px 2px;font-family:var(--mono)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,10,5,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:var(--surface);width:100%;max-width:760px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:14px 14px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .box>header{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--surface);padding:12px 0 8px;z-index:2}
.x{min-height:40px;padding:2px 14px}
.photo{width:100%;height:230px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:10px 0;font-size:14px}
dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
dd{margin:0;word-break:break-word}
.consid{background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:13px;margin:8px 0}
.aviso{background:var(--late-soft);color:var(--late);border:1px solid var(--late);border-radius:6px;padding:9px 11px;font-size:14px;font-weight:600;margin:8px 0;white-space:pre-line}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.err{color:var(--late);font-size:13px;min-height:1px;margin:6px 0}
.setup{max-width:520px;margin:20px auto;text-align:center}
.setup img{width:150px;height:150px;border-radius:24px;display:block;margin:0 auto 12px}
.vrow{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.vrow:last-child{border-bottom:0}
.vrow .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.kpi div{background:var(--accent-soft);border-radius:8px;padding:8px 4px;text-align:center}
.kpi b{display:block;font:600 22px var(--mono)} .kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mrow .c{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.mrow .c span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.back{display:flex;align-items:center;gap:8px}
.back button{flex:0 0 auto;min-width:46px;font-size:18px}
details>summary{cursor:pointer;font-weight:600;padding:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Material<small>SAER · GRUHEL</small></div>
  <button id="pill" type="button" data-a="sync">…</button>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs" hidden>
  <a href="#inicio" data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="#material" data-v="material"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="5"/><path d="M15.5 8.5l-1.2 6"/></svg>Material</a>
  <a href="#revisar" data-v="revisar"><svg viewBox="0 0 24 24"><path d="M9 4h6M8 3h8v3H8z"/><rect x="5" y="4.5" width="14" height="17" rx="2"/><path d="M8.5 13l2.5 2.5 4.5-5"/></svg>Revisar</a>
  <a href="#incidencias" data-v="incidencias"><svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.1"/></svg>Incidencias</a>
  <a href="#mas" data-v="mas"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Más</a>
</nav>
<div class="sheet" id="sheet"><div class="box" id="sbox"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>

<script>
'use strict';
const VER='2.0';
const KEY='material-gruhel-v1';
const HELI='HELICÓPTERO ',SACA='SACA AMARILLA',OFI='OFICINA (REPUESTO)',SALA='SALA MECÁNICOS';
const BLOQUEA=['PRESTADO · PEND. DEVOLUCIÓN','EN REPARACIÓN','DAÑADO · NO USAR','PERDIDO','BAJA'];
const QUE=['PRESTADO · PEND. DEVOLUCIÓN','EN REPARACIÓN','DAÑADO · NO USAR','PERDIDO','PEDIR REPOSICIÓN','DEVUELTO / RECUPERADO','REPARADO','BAJA','OTRO'];
const CIERRA=['DEVUELTO / RECUPERADO','REPARADO'],INFO=['CAMBIO DE UBICACIÓN','ALTA NUEVA','OTRO','DATOS MODIFICADOS'];
const PED_EST=['PENDIENTE DE PEDIR','SOLICITADO A MATERIAL','RECIBIDO PARCIAL','RECIBIDO','ANULADO'];
const PED_AB=PED_EST.slice(0,3);
let S={url:'',token:'',quien:'',data:null,pend:[],lastOk:0,err:'',hint:0};
let F={},FX={};                      // fotos (en memoria; se guardan en el móvil aparte) y su versión
let V={filtro:'',q:'',rev:null,pf:'ab',pq:'',cq:'',min:null,uq:''};
let nuevaVersion=false;

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>{s=String(s||'');return s.charAt(0)+s.slice(1).toLowerCase();};
const pl=(n,uno,varios)=>n+' '+(n===1?uno:varios);
function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmt(iso){iso=String(iso||'');if(!/^\d{4}-\d\d-\d\d/.test(iso))return iso;const[a,m,d]=iso.slice(0,10).split('-');return d+'/'+m+'/'+a;}
function dias(iso){if(!/^\d{4}-\d\d-\d\d/.test(iso||''))return null;return Math.round((new Date(String(iso).slice(0,10)+'T12:00')-new Date(hoy()+'T12:00'))/864e5);}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3000);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY)||'null');
    if(j){if(j.fotos){for(const k in j.fotos){F[k]=j.fotos[k];FX[k]='1';fotoGuardar(k,j.fotos[k],'1');}delete j.fotos;}
      S={...S,...j};if(S.data)S.data=norm(S.data);S.pend=(S.pend||[]).map(o=>o.op?o:{...o,op:uid()});save();}
  }catch(e){}
}
function norm(j){
  const d={};['inventario','catalogo','minimos','revisiones','vicisitudes','pedidos','helis','usos','registro'].forEach(k=>d[k]=Array.isArray(j[k])?j[k]:[]);
  d.usos.forEach(u=>{u.ciclos=Number(u.ciclos)||0;u.activ=Number(u.activ)||0;});
  return d;
}

/* ---------- fotos guardadas en el móvil (IndexedDB) ---------- */
let dbp=null;
function db(){if(!dbp){dbp=new Promise((ok,ko)=>{try{const r=indexedDB.open('material-gruhel',1);r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);}catch(e){ko(e);}});dbp.catch(()=>{});}return dbp;}
async function tx(fn){try{const d=await db();await new Promise((ok,ko)=>{const t=d.transaction('fotos','readwrite');fn(t.objectStore('fotos'));t.oncomplete=ok;t.onerror=t.onabort=()=>ko(t.error);});}catch(e){}}
async function fotosCargar(){try{const d=await db();await new Promise((ok,ko)=>{const rq=d.transaction('fotos').objectStore('fotos').openCursor();rq.onsuccess=()=>{const c=rq.result;if(!c)return ok();if(!(c.key in F)){F[c.key]=c.value.v;FX[c.key]=c.value.ver;}c.continue();};rq.onerror=()=>ko(rq.error);});}catch(e){}}
function fotoGuardar(k,v,ver){F[k]=v;FX[k]=ver;return tx(s=>s.put({v,ver},k));}
function fotoBorrar(k){delete F[k];delete FX[k];return tx(s=>s.delete(k));}
function fotosVaciar(){F={};FX={};return tx(s=>s.clear());}
async function syncFotos(idx,todas){
  if(!idx)return;
  for(const k of Object.keys(FX))if(!(k in idx)&&FX[k]!=='local')await fotoBorrar(k);
  const faltan=Object.keys(idx).filter(k=>FX[k]!=='local'&&(todas||FX[k]!==idx[k]));
  for(let i=0;i<faltan.length;i+=30){
    const lote=faltan.slice(i,i+30),f=await apiGet('fotos',{claves:lote.join(',')});
    for(const k of lote)if(f.fotos[k])await fotoGuardar(k,f.fotos[k],idx[k]);
    render(true);
  }
}

/* ---------- modelo ---------- */
const D=()=>S.data||norm({});
const esHeli=s=>String(s||'').startsWith('HELICÓPTERO');
const corto=s=>s===SACA?'Saca amarilla':s===OFI?'Oficina':s===SALA?'Sala mecánicos':esHeli(s)?cap(s):String(s||'');
const colaDe=s=>String(s||'').slice(HELI.length);
function helis(){
  const h=D().helis.map(x=>({cola:String(x.cola),principal:x.principal==='SÍ'||x.principal===true}));
  return h.sort((a,b)=>(b.principal-a.principal));
}
function sitiosHeli(){
  const h=helis().map(x=>HELI+x.cola);
  D().inventario.forEach(p=>{if(esHeli(p.asignado)&&!h.includes(p.asignado)&&p.estado!=='BAJA')h.push(p.asignado);});
  return h;
}
function sitios(){return[...sitiosHeli(),SACA,OFI,SALA];}
function cat(cod){return D().catalogo.find(c=>c.cod===cod)||{};}
function pieza(id){return D().inventario.find(p=>p.id===id);}
function nombre(p){return p.desc||cat(p.cod).desc||p.cod||p.id;}
function foto(p){return F[p.id]||F[p.cod]||'';}
function fotoPed(x){return F[x.id]||F[x.cod]||'';}
function img(src,cls){return src?`<img class="ph ${cls||''}" src="${src}" alt="" loading="lazy" decoding="async">`:`<div class="ph ${cls||''}"></div>`;}
function abiertas(id){return D().vicisitudes.filter(v=>v.id===id&&v.resuelto!=='SÍ');}
function situacion(p){
  if(p.estado&&p.estado!=='OK')return p.estado;
  const ab=abiertas(p.id).filter(v=>BLOQUEA.includes(v.que));
  return ab.length?ab[ab.length-1].que:'OK';
}
function cadu(p){
  const c=String(p.caduca||'').trim();
  if(!c)return{t:'Sin dato',k:'n'};
  if(/ON CONDITION/i.test(c))return{t:'On condition',k:'n'};
  const d=dias(c); if(d===null)return{t:c,k:'n'};
  if(d<0)return{t:'Caducado '+fmt(c),k:'late',d};
  if(d<365)return{t:'Caduca '+fmt(c),k:'warn',d};
  return{t:'Caduca '+fmt(c).slice(3),k:'ok',d};
}
function disponible(p){return situacion(p)==='OK'&&cadu(p).k!=='late';}
function activas(){return D().inventario.filter(p=>situacion(p)!=='BAJA');}
function enSitio(s){return activas().filter(p=>p.asignado===s);}
function sitTag(s){const k=s==='OK'?'ok':(s.startsWith('PRESTADO')||s==='EN REPARACIÓN'?'warn':'late');return `<span class="tag ${k}">${esc(s==='PRESTADO · PEND. DEVOLUCIÓN'?'Prestado':s)}</span>`;}
function ultimaRev(sitio){const r=D().revisiones.filter(r=>r.sitio===sitio&&r.fecha);return r.length?r.sort((a,b)=>a.fecha<b.fecha?-1:1)[r.length-1]:null;}
function minimos(sitio){
  const col=esHeli(sitio)?'heli':sitio===SACA?'saca':null; if(!col)return[];
  const aqui=D().inventario.filter(p=>p.asignado===sitio&&disponible(p));
  return D().minimos.filter(m=>Number(m[col])>0).map(m=>({tipo:m.etiqueta||m.tipo,min:Number(m[col]),hay:aqui.filter(p=>cat(p.cod).tipo===m.tipo).length}));
}
function faltan(sitio){return minimos(sitio).filter(m=>m.hay<m.min);}
function helisConFalta(){return sitiosHeli().filter(s=>enSitio(s).length&&faltan(s).length);}
function deSaca(s){return activas().filter(p=>p.origen===SACA&&esHeli(p.asignado)&&(!s||p.asignado===s));}
function usosDe(id){return D().usos.filter(u=>u.pieza===id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))||String(b.id).localeCompare(String(a.id)));}
function totUsos(id){const u=usosDe(id);return{n:u.length,ciclos:u.reduce((a,x)=>a+x.ciclos,0),activ:u.reduce((a,x)=>a+x.activ,0),ult:u[0]};}
function operadores(){const o=[];D().usos.slice().reverse().forEach(u=>{const n=String(u.operador||'').trim();if(n&&!o.includes(n))o.push(n);});return o.slice(0,8);}
function duenos(){const o=[];D().inventario.forEach(p=>{const n=String(p.dueno||'').trim();if(n&&!o.includes(n))o.push(n);});return o;}
function tipos(){return[...new Set(D().catalogo.map(c=>c.tipo).filter(Boolean))].sort();}
function nRec(x){return(String(x.destino||'').match(/M\d+/g)||[]).length;}
function miEnlace(){let b=btoa(JSON.stringify({u:S.url,t:S.token}));return location.origin+location.pathname+'#conectar='+b.replace(/=+$/,'');}
const esIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const instalada=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;

/* ---------- conexión ---------- */
function conectarCon(txt){
  const m=String(txt||'').match(/conectar=([A-Za-z0-9+/=%_-]+)/);if(!m)return false;
  try{let b=decodeURIComponent(m[1]).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const j=JSON.parse(atob(b));if(j.u&&j.t){if(S.token!==j.t){S.pend=[];S.data=null;fotosVaciar();}S.url=j.u;S.token=j.t;S.err='';save();return true;}}catch(e){}
  return false;
}
function tryLink(){
  if(!/conectar=/.test(location.hash))return false;
  const ok=conectarCon(location.hash);
  history.replaceState(null,'',location.pathname+'#inicio');
  if(!ok)toast('El enlace está incompleto. Pégalo entero abajo.');
  return ok;
}
async function apiGet(action,extra){
  const u=new URL(S.url);u.searchParams.set('app','mat');u.searchParams.set('action',action);u.searchParams.set('token',S.token);u.searchParams.set('_',Date.now());
  if(extra)for(const k in extra)u.searchParams.set(k,extra[k]);
  const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j;
}
async function apiPost(action,payload,op){
  const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({app:'mat',token:S.token,action,payload,op:op||uid()})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();if(!j.ok){const e=new Error(j.error||'error');e.server=!j.retry;throw e;}return j;
}
let pulling=false,otra=false;
async function pull(todas){
  if(!S.url)return;
  if(pulling){otra=true;return;}pulling=true;
  try{
    await drain();
    if(S.pend.length)throw new Error('pendiente');
    const j=await apiGet('todo');
    S.quien=j.quien;S.data=norm(j);S.lastOk=Date.now();S.err='';save();render(true);
    await syncFotos(j.fotosIdx,todas);
  }catch(e){if(e.message!=='pendiente')S.err=e.message;pill();}
  finally{pulling=false;if(otra){otra=false;pull();}}
}
let drainP=null;
function drain(){if(!drainP)drainP=drainLoop().finally(()=>{drainP=null;});return drainP;}
async function drainLoop(){
  {
    while(S.pend.length){
      const op=S.pend[0];
      try{const r=await apiPost(op.a,op.p,op.op);
        if(op.a==='setFoto'&&r.result&&F[op.p.k]===op.p.v)await fotoGuardar(op.p.k,op.p.v,r.result.ver);
        S.pend.shift();save();pill();}
      catch(e){if(e.server){S.pend.shift();save();toast('No se pudo guardar: '+e.message);}else{S.err='sin conexión';pill();return;}}
    }
  }
}
// aplica el cambio en el móvil al momento y lo manda a la hoja (o lo deja en cola si no hay cobertura)
function cambio(a,p){
  aplicar(a,p);S.pend.push({a,p,op:uid()});save();render();
  drain().then(()=>{if(!S.pend.length)pull();});
}
function aplicar(a,p){
  const d=D();
  if(a==='addRevision')d.revisiones.push({fecha:hoy(),quien:p.quien,sitio:p.sitio,ok:p.ok,obs:p.obs});
  if(a==='addVicisitud'){
    const cierra=CIERRA.includes(p.que),info=INFO.includes(p.que),pz=pieza(p.id);
    if(cierra)d.vicisitudes.forEach(v=>{if(v.id===p.id&&v.resuelto!=='SÍ'){v.resuelto='SÍ';v.fres=hoy();}});
    let det=p.detalle||'';
    if(pz&&p.que==='CAMBIO DE UBICACIÓN'){det='Desde '+pz.asignado+(det?' — '+det:'');pz.origen=p.donde===SALA?(pz.asignado!==SALA?pz.asignado:pz.origen):'';pz.asignado=p.donde;}
    if(pz&&p.que==='BAJA')pz.estado='BAJA';
    d.vicisitudes.push({fecha:hoy(),id:p.id,que:p.que,donde:p.donde,detalle:det,resuelto:cierra||info?'SÍ':'NO',fres:cierra||info?hoy():'',quien:S.quien,_tmp:1});
  }
  if(a==='moverVarias')p.ids.forEach(id=>{const pz=pieza(id);if(!pz||pz.asignado===p.hasta)return;
    d.vicisitudes.push({fecha:hoy(),id,que:'CAMBIO DE UBICACIÓN',donde:p.hasta,detalle:'Desde '+pz.asignado+(p.detalle?' — '+p.detalle:''),resuelto:'SÍ',fres:hoy(),quien:S.quien,_tmp:1});
    pz.origen=p.hasta===SALA?pz.asignado:(p.origen==='='?pz.origen:(p.origen||''));pz.asignado=p.hasta;});
  if(a==='resolver'){const v=d.vicisitudes.find(v=>v._r===p._r&&v.id===p.id);if(v){v.resuelto='SÍ';v.fres=hoy();}}
  if(a==='updatePieza'){const pz=pieza(p.id);if(pz)Object.assign(pz,p.fields);}
  if(a==='updatePedido'){const x=d.pedidos.find(x=>x.id===p.id);if(x){if(p.fields.estado&&p.fields.estado!==x.estado)x.hist=(x.hist?x.hist+'\n':'')+hoy()+' '+S.quien+': '+x.estado+' → '+p.fields.estado;Object.assign(x,p.fields);}}
  if(a==='addPedido')d.pedidos.push({...p,id:'P··',fecha:hoy(),quien:S.quien,hist:hoy()+' '+S.quien+': anotado ('+p.estado+')'});
  if(a==='updateCat'){const c=cat(p.cod);if(c.cod){const f={...p.fields};['ciclos','cola'].forEach(k=>{if(k in f)f[k]=f[k]?'SÍ':'';});Object.assign(c,f);}}
  if(a==='setMinimos')d.minimos=p.items.map(m=>({...m}));
  if(a==='setHelis')d.helis=p.helis.map(h=>({cola:h.cola,principal:h.principal?'SÍ':''}));
  if(a==='addUsos')p.items.forEach((it,i)=>d.usos.push({id:'U··'+uid()+i,_tmp:1,fecha:p.fecha,pieza:it.pieza,ciclos:it.ciclos,activ:it.activ||0,operador:p.operador,nota:p.nota,quien:S.quien}));
  if(a==='updateUso'){const u=d.usos.find(u=>u.id===p.id);if(u)Object.assign(u,p.fields);}
  if(a==='delUso')d.usos=d.usos.filter(u=>u.id!==p.id);
  if(a==='setFoto'){F[p.k]=p.v;FX[p.k]='local';tx(s=>s.put({v:p.v,ver:'local'},p.k));}
}
function pill(){

function guardarRev(){
  const R=V.rev,l=enSitio(R.sitio);
  const sin=l.filter(p=>!R.m[p.id]);
  if(sin.length&&!confirm(`Quedan ${sin.length} piezas sin marcar. ¿Guardar igualmente?`))return;
  const fl=l.filter(p=>R.m[p.id]==='no');
  const obs=[fl.length?'Falta / revisar: '+fl.map(p=>p.id+' '+nombre(p)).join('; '):'',sin.length?'Sin comprobar: '+sin.map(p=>p.id).join(', '):'',R.obs].filter(Boolean).join(' | ');
  V.rev=null;
  cambio('addRevision',{sitio:R.sitio,ok:fl.length?'NO':'SÍ',obs,quien:R.junto?'ALBERTO Y DAVID':S.quien});
  toast(fl.length?'Revisión guardada. Si falta algo, anótalo como incidencia.':'Revisión guardada ✓');
  if(fl.length===1)setTimeout(()=>abrirIncid(fl[0].id),400);
  scrollTo(0,0);
}

let RC=null;
function abrirRecibir(id){
  if(!navigator.onLine){toast('Para dar de alta lo recibido necesitas cobertura');return;}
  const x=D().pedidos.find(x=>x.id===id);if(!x)return;

function leerRecibir(){
  if(!$('#r-c'))return;RC.cod=$('#r-c').value;RC.fab=$('#r-f').value;RC.caduca=$('#r-k').value;RC.oc=$('#r-oc').checked;RC.alb=$('#r-a').value;
  $$('[data-ru]').forEach(s=>{const i=Number(s.dataset.ru);RC.u[i]=RC.u[i]||{};RC.u[i][s.dataset.k]=s.value;});
}
function pintarRecibir(){
  const x=D().pedidos.find(x=>x.id===RC.id),total=Number(x.cant)||1,ya=nRec(x),def=sitios()[0];
  while(RC.u.length<RC.n)RC.u.push({asignado:RC.u.length?RC.u[RC.u.length-1].asignado:def,serie:''});
  sheet(`${cab('Recibir pedido '+esc(x.id))}
  <p style="margin:0"><b>${esc(x.material)}</b><br><span class="hint">Pedidas ${total}${ya?` · ya recibidas ${ya}`:''}</span></p>
  <label for="r-c">Referencia del catálogo</label><select id="r-c"><option value="">Elige…</option>${D().catalogo.map(c=>`<option value="${esc(c.cod)}" ${c.cod===RC.cod?'selected':''}>${esc(c.cod)} · ${esc(c.desc)}</option>`).join('')}</select>
  <label>¿Cuántas han llegado?</label>${stepHTML(RC.n,'id="r-n"',1)}
  <label>Dónde va cada una</label>
  ${RC.u.slice(0,RC.n).map((u,i)=>`<div class="mrow"><div class="hint">Unidad ${i+1}</div><div class="row" style="margin-top:4px"><select data-ru="${i}" data-k="asignado">${sitioOpts(u.asignado)}</select><input data-ru="${i}" data-k="serie" value="${esc(u.serie||'')}" placeholder="Nº serie (opcional)" autocapitalize="characters"></div></div>`).join('')}
  <div class="row"><div><label for="r-f">Fabricación</label><input id="r-f" value="${esc(RC.fab)}" placeholder="mm/aaaa"></div><div><label for="r-k">Caduca</label><input id="r-k" type="date" value="${esc(RC.caduca)}" ${RC.oc?'disabled':''}></div></div>
  <label class="ck"><input type="checkbox" id="r-oc" ${RC.oc?'checked':''}>On condition (sin caducidad)</label>
  <label for="r-a">Albarán / nº de salida</label><input id="r-a" value="${esc(RC.alb)}">
  <p class="hint">${ya+RC.n<total?`Quedarán ${total-ya-RC.n} por llegar: el pedido pasa a «recibido parcial».`:'Con esto el pedido queda como «recibido».'} El nº de serie y la caducidad se pueden completar después en cada pieza.</p>
  <p class="err" id="r-e"></p><button class="primary w" data-a="guardarRecibir">Dar de alta ${pl(RC.n,'pieza','piezas')}</button>`,true);
  $('#r-n').oninput=e=>{leerRecibir();RC.n=Math.min(30,Math.max(1,Number(e.target.value)||1));pintarRecibir();};
  $('#r-oc').onchange=e=>$('#r-k').disabled=e.target.checked;
}
function guardarRecibir(btn){
  leerRecibir();
  if(!RC.cod){$('#r-e').textContent='Elige la referencia del catálogo (o créala antes en Catálogo).';return;}
  const x=D().pedidos.find(x=>x.id===RC.id),total=Number(x.cant)||1;
  enLinea(btn,'',async()=>{
    const r=await apiPost('recibirPedido',{id:RC.id,cod:RC.cod,unidades:RC.u.slice(0,RC.n).map(u=>({asignado:u.asignado,serie:(u.serie||'').trim()})),fab:RC.fab.trim(),caduca:RC.oc?'ON CONDITION':RC.caduca,albaran:RC.alb.trim(),parcial:nRec(x)+RC.n<total});
    cerrar();toast('Alta '+r.result.piezas.map(p=>p.id).join(', ')+' ✓');await pull();
  },$('#r-e'));
}

  if(cod){const c=cat(cod),ch={};Object.keys(f).forEach(k=>{const a=(k==='ciclos'||k==='cola')?c[k]==='SÍ':String(c[k]??'');if(a!==f[k])ch[k]=f[k];});
    if(Object.keys(ch).length){cambio('updateCat',{cod,fields:ch});toast('Guardado ✓');}abrirCat(cod);return;}
  enLinea(btn,'',async()=>{const r=await apiPost('addCat',f);await pull();abrirCat(r.result.cod,true);},$('#c-e'));
}

/* ----- ciclos de grúa (hojas) ----- */
let U=null;
function abrirCiclo(id){
  const p=id&&pieza(id),con=activas().filter(x=>cat(x.cod).ciclos==='SÍ');
  if(!con.length){toast('Ninguna referencia tiene activado el control de ciclos (Catálogo → Editar referencia)');return;}
  const hs=sitiosHeli().filter(s=>con.some(x=>x.asignado===s));
  U={fecha:hoy(),operador:'',ciclos:1,nota:'',sitio:p?p.asignado:(hs.includes(V.filtro)?V.filtro:(hs[0]||con[0].asignado)),sel:{},act:{}};
  if(p)U.sel[id]=true;
  pintarCiclo();
}
function leerCiclo(){
  if(!$('#u-f'))return;U.fecha=$('#u-f').value||hoy();U.operador=$('#u-o').value;U.ciclos=Math.max(1,Number($('#u-c').value)||1);U.nota=$('#u-n').value;U.sitio=$('#u-s').value;
  $$('[data-act]').forEach(i=>U.act[i.dataset.act]=Math.max(0,Number(i.value)||0));
}
function pintarCiclo(mantener){
  const con=activas().filter(x=>cat(x.cod).ciclos==='SÍ'),ss=sitios().filter(s=>con.some(x=>x.asignado===s));
  const l=con.filter(x=>U.sitio==='TODO'||x.asignado===U.sitio||U.sel[x.id]),ops=operadores(),nsel=Object.values(U.sel).filter(Boolean).length;
  sheet(`${cab('Ciclo de grúa')}
  <div class="row"><div><label for="u-f">Fecha</label><input id="u-f" type="date" value="${esc(U.fecha)}" max="${hoy()}"></div><div><label>Nº de ciclos</label>${stepHTML(U.ciclos,'id="u-c"',1)}</div></div>
  <label for="u-o">Operador de grúa</label><input id="u-o" value="${esc(U.operador)}" placeholder="Ej.: COY, ALBERTO, MONTES…" autocapitalize="characters" autocomplete="off">
  ${ops.length?`<div class="chips" style="margin-top:6px">${ops.map(o=>`<button type="button" data-a="pon" data-x="u-o" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`:''}
  <label for="u-s">Material usado · ${nsel} marcado${nsel===1?'':'s'}</label><select id="u-s">${ss.map(s=>`<option value="${esc(s)}" ${s===U.sitio?'selected':''}>${esc(corto(s))}</option>`).join('')}<option value="TODO" ${U.sitio==='TODO'?'selected':''}>Todas las ubicaciones</option></select>
  <div>${l.map(p=>{const on=!!U.sel[p.id],c=cat(p.cod);return `<div class="check"><div class="main" data-a="uSel" data-x="${esc(p.id)}" style="cursor:pointer;display:flex;gap:10px;align-items:center">${img(foto(p),'s')}<div><b class="num" style="font-size:12px;color:var(--muted)">${esc(p.id)}</b> ${esc(nombre(p))}<div class="hint">${p.serie?'Nº '+esc(p.serie)+' · ':''}${esc(corto(p.asignado))}</div></div></div>
    <div class="tog"><button class="okb ${on?'on':''}" data-a="uSel" data-x="${esc(p.id)}" aria-pressed="${on}" aria-label="Usado">✓</button></div></div>
    ${on&&c.cola==='SÍ'?`<div class="check" style="padding-left:58px"><div class="main"><b>Activaciones de la cola</b><div class="hint">0 si no se activó</div></div>${stepHTML(U.act[p.id]||0,`data-act="${esc(p.id)}"`)}</div>`:''}`;}).join('')||'<div class="hint" style="padding:8px 0">Aquí no hay material con control de ciclos.</div>'}</div>
  <label for="u-n">Nota (opcional)</label><input id="u-n" value="${esc(U.nota)}" placeholder="Ej.: rescate en La Pedriza, práctica…">
  <p class="err" id="u-e"></p><button class="primary w" data-a="guardarCiclo">Guardar</button>`,mantener);
  $('#u-s').onchange=()=>{leerCiclo();pintarCiclo(true);};
}
function guardarCiclo(){
  leerCiclo();const ids=Object.keys(U.sel).filter(k=>U.sel[k]),op=U.operador.trim().toUpperCase();
  if(!ids.length){$('#u-e').textContent='Marca al menos una pieza usada.';return;}
  if(!op){$('#u-e').textContent='Pon quién fue el operador de grúa.';return;}
  const p={fecha:U.fecha,operador:op,nota:U.nota.trim(),items:ids.map(id=>({pieza:id,ciclos:U.ciclos,activ:cat(pieza(id).cod).cola==='SÍ'?(U.act[id]||0):0}))};
  cerrar();cambio('addUsos',p);toast(pl(ids.length,'pieza anotada','piezas anotadas')+' ✓');
}
function abrirUso(id){
  const u=D().usos.find(u=>u.id===id);if(!u)return;const p=pieza(u.pieza),cola=p&&cat(p.cod).cola==='SÍ';
  sheet(`${cab('Editar anotación')}
  <p style="margin:0"><b>${esc(u.pieza)}</b> · ${esc(p?nombre(p):'')}</p>
  <div class="row"><div><label for="x-f">Fecha</label><input id="x-f" type="date" value="${esc(String(u.fecha).slice(0,10))}" max="${hoy()}"></div><div><label>Nº de ciclos</label>${stepHTML(u.ciclos,'id="x-c"',1)}</div></div>
  ${cola?`<label>Activaciones de la cola</label>${stepHTML(u.activ,'id="x-a"')}`:''}
  <label for="x-o">Operador de grúa</label><input id="x-o" value="${esc(u.operador)}" autocapitalize="characters">
  <label for="x-n">Nota</label><input id="x-n" value="${esc(u.nota)}">
  <button class="primary w" data-a="guardarUso" data-x="${esc(id)}">Guardar</button>
  <button class="danger w" data-a="borrarUso" data-x="${esc(id)}">Borrar esta anotación</button>`);
}
function guardarUso(id){
  const u=D().usos.find(u=>u.id===id),f={fecha:$('#x-f').value||u.fecha,ciclos:Math.max(1,Number($('#x-c').value)||1),operador:$('#x-o').value.trim().toUpperCase(),nota:$('#x-n').value.trim()};
  if($('#x-a'))f.activ=Math.max(0,Number($('#x-a').value)||0);
  Object.keys(f).forEach(k=>{if(String(f[k])===String(u[k]??''))delete f[k];});
  const pz=u.pieza;if(Object.keys(f).length){cambio('updateUso',{id,fields:f});toast('Guardado ✓');}
  abrirFicha(pz);
}

/* ----- helicópteros (hojas) ----- */
function ponerHelis(lista){if(lista.length&&!lista.some(h=>h.principal))lista[0].principal=true;cambio('setHelis',{helis:lista});}
function asegurarHeli(cola){const hs=helis();if(hs.some(h=>h.cola===cola))return;ponerHelis([...hs,{cola,principal:false}]);}
function limpiaCola(v){return String(v||'').trim().toUpperCase().replace(/^HELIC[ÓO]PTERO\s*/,'').replace(/\s+/g,' ').slice(0,12);}
function elegirHeli(titulo,texto,excluir,accion,extra){
  const hs=helis().filter(h=>h.cola!==excluir);
  sheet(`${cab(titulo)}<p style="margin:0 0 4px">${texto}</p>
  ${hs.length?`<label>Helicóptero</label><div class="chips" id="eh">${hs.map((h,i)=>`<button type="button" data-a="chip" data-c="${esc(h.cola)}" aria-pressed="${i===0&&hs.length===1}">${esc(h.cola)}</button>`).join('')}</div>`:''}
  <label for="eh-n">${hs.length?'…o uno nuevo: nº de cola':'Nº de cola'}</label><input id="eh-n" placeholder="p. ej. 320" inputmode="numeric" maxlength="12">
  ${extra||''}<p class="err" id="eh-e"></p><button class="primary w" data-a="${accion}" data-x="${esc(excluir||'')}">Aceptar</button>`);
}
function heliElegido(){const n=limpiaCola($('#eh-n').value);return n||$('#eh [aria-pressed=true]')?.dataset.c||'';}

/* ---------- fotos ---------- */
let fotoPara=null;
async function fotoElegida(e){
  const f=e.target.files[0];e.target.value='';if(!f||!fotoPara)return;
  const k=fotoPara;
  try{
    const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(f);});
    let url='';
    busca:for(const max of[640,560,480,400,320,260]){
      const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(im.naturalWidth*sc));cv.height=Math.max(1,Math.round(im.naturalHeight*sc));
      const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.imageSmoothingQuality='high';g.drawImage(im,0,0,cv.width,cv.height);
      for(const q of[.82,.72,.62,.5]){
        url=cv.toDataURL('image/webp',q);
        if(!url.startsWith('data:image/webp'))url=cv.toDataURL('image/jpeg',q);   // iPhone no crea WebP
        if(url.length<=45000)break busca;
      }
    }
    URL.revokeObjectURL(im.src);
    if(url.length>47000)throw new Error('grande');
    cambio('setFoto',{k,v:url});toast('Foto guardada ✓');
    if(/^C/.test(k))abrirCat(k);else abrirFicha(k);
  }catch(err){toast('No se pudo leer la foto');}
}
$('#cam').onchange=fotoElegida;$('#gal').onchange=fotoElegida;

/* ---------- acciones ---------- */
const A={
  sync(){pull();toast('Sincronizando…');},
  go(x){cerrar();if(location.hash===x)render();else location.hash=x;},
  cerrar(){cerrar();},
  pegar(){if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(t=>{$('#link').value=t;}).catch(()=>toast('Mantén pulsado en la casilla y elige «Pegar»'));else toast('Mantén pulsado en la casilla y elige «Pegar»');},
  conectar(){if(conectarCon($('#link').value)){render();pull(true);}else $('#link-e').textContent='No reconozco el enlace: cópialo completo, incluida la parte «#conectar=…».';},
  copiarEnlace(){const t=miEnlace();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Enlace copiado ✓')).catch(()=>{sheet(`${cab('Mi enlace')}<p class="hint">Mantén pulsado para copiarlo.</p><textarea readonly style="min-height:160px">${esc(t)}</textarea>`);});},
  ocultarGuia(){S.hint=1;save();render();},
  recargar(){pull(true);toast('Recargando…');},
  ficha(x){abrirFicha(x);},
  verSitio(x){V.filtro=x;V.q='';A.go('#material');},
  filtro(x){V.filtro=x;render();},
  movs(x){V.movs=!!x;render(true);},
  rev(x){V.rev={sitio:x,m:{},obs:'',junto:false};if(vista()==='revisar'){render();scrollTo(0,0);}else location.hash='#revisar';},
  mk(x,t){V.rev.m[x]=V.rev.m[x]===t.dataset.val?undefined:t.dataset.val;render(true);},
  todoOk(){enSitio(V.rev.sitio).forEach(p=>{if(!V.rev.m[p.id])V.rev.m[p.id]='ok';});render(true);},
  cancelRev(){V.rev=null;render();},
  guardarRev(){guardarRev();},
  nueva(x){abrirIncid(x||'');},
  chip(x,t){t.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));},
  pon(x,t){const i=document.getElementById(x);if(i){i.value=t.dataset.val;}},
  st(x,t){const i=t.parentNode.querySelector('input'),min=Number(i.min||0);i.value=Math.max(min,(Number(i.value)||0)+Number(x));i.dispatchEvent(new Event('input',{bubbles:true}));},
  guardarInc(){guardarInc();},
  resolver(x,t){if(confirm('¿Marcar como resuelta?'))cambio('resolver',{_r:Number(x),id:t.dataset.id});},
  mover(x){abrirMover(x);},
  moverA(x,t){const id=t.dataset.id,det=$('#m-t').value.trim();mover(id,x,det);abrirFicha(id);},
  devolver(x){const p=pieza(x);if(!p||!p.origen)return;const ab=$('#sheet').classList.contains('on');mover(x,p.origen,'Vuelve a su sitio');if(ab)abrirFicha(x);},
  editar(x){abrirEditar(x);},
  guardarEdit(x){guardarEdit(x);},
  foto(x,t){fotoPara=x;$(t.dataset.m==='gal'?'#gal':'#cam').click();},
  alta(x){abrirAlta(x||'');},
  guardarAlta(x,t){guardarAlta(t);},
  pf(x){V.pf=x;render();},
  pedido(x){abrirPedido(x);},
  guardarPed(x){guardarPed(x);},
  pedidoNuevo(x){abrirPedidoNuevo(x||'');},
  guardarPedNuevo(){guardarPedNuevo();},
  recibir(x){abrirRecibir(x);},
  guardarRecibir(x,t){guardarRecibir(t);},
  cat(x){abrirCat(x);},
  catNueva(){abrirCatForm('');},
  catEditar(x){abrirCatForm(x);},
  guardarCat(x,t){guardarCat(x,t);},
  ciclo(x){abrirCiclo(x||'');},
  uSel(x){leerCiclo();U.sel[x]=!U.sel[x];pintarCiclo(true);},
  guardarCiclo(){guardarCiclo();},
  uso(x){abrirUso(x);},
  guardarUso(x){guardarUso(x);},
  borrarUso(x){const u=D().usos.find(u=>u.id===x);if(!u||!confirm('¿Borrar esta anotación? Los totales se recalculan.'))return;const pz=u.pieza;cambio('delUso',{id:x});toast('Borrada');abrirFicha(pz);},
  minQuitar(x){if(confirm('¿Quitar «'+cap(V.min[x].etiqueta)+'» de los mínimos?')){V.min.splice(Number(x),1);render();}},
  minAdd(){const t=$('#min-t').value;if(t){V.min.push({tipo:t,etiqueta:t,heli:1,saca:0});render();scrollTo(0,document.body.scrollHeight);}},
  minCancelar(){V.min=null;render();},
  minGuardar(){const items=V.min.map(m=>({...m}));V.min=null;cambio('setMinimos',{items});toast('Mínimos guardados ✓');},
  heliAdd(){const c=limpiaCola($('#h-n').value);if(!c){$('#h-e').textContent='Escribe el número de cola.';return;}if(helis().some(h=>h.cola===c)){$('#h-e').textContent='Ese helicóptero ya está en la lista.';return;}asegurarHeli(c);toast('Helicóptero '+c+' añadido ✓');},
  heliPrincipal(x){ponerHelis(helis().map(h=>({cola:h.cola,principal:h.cola===x})));toast(x+' es ahora el principal ✓');},
  heliPasar(x){elegirHeli('Pasar material del '+esc(x),`Todo el material del <b>${esc(x)}</b> (${pl(enSitio(HELI+x).length,'pieza','piezas')}) pasa al helicóptero que elijas.`,x,'heliPasarOk',`<label class="ck"><input type="checkbox" id="eh-q" checked>Quitar el ${esc(x)} de la lista después</label>`);},
  heliPasarOk(x){const c=heliElegido();if(!c||c===x){$('#eh-e').textContent='Elige el helicóptero de destino.';return;}
    const quitar=$('#eh-q').checked,ids=enSitio(HELI+x).map(p=>p.id),era=helis().find(h=>h.cola===x)?.principal;
    cerrar();asegurarHeli(c);cambio('moverVarias',{ids,hasta:HELI+c,origen:'=',detalle:'Cambio de helicóptero '+x+' → '+c});
    if(quitar)ponerHelis(helis().filter(h=>h.cola!==x).map(h=>({cola:h.cola,principal:era?h.cola===c:h.principal})));
    toast(pl(ids.length,'pieza pasada','piezas pasadas')+' al '+c+' ✓');},
  heliQuitar(x){const n=enSitio(HELI+x).length;
    if(!n){if(confirm('¿Quitar el helicóptero '+x+' de la lista?'))ponerHelis(helis().filter(h=>h.cola!==x));return;}
    const otros=[...sitiosHeli().filter(s=>s!==HELI+x),SACA,OFI];
    sheet(`${cab('Quitar el '+esc(x))}<p style="margin:0">Tiene ${pl(n,'pieza','piezas')}. ¿A dónde pasan?</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">${otros.map(s=>`<button data-a="heliQuitarOk" data-x="${esc(x)}" data-s="${esc(s)}">${esc(corto(s))}</button>`).join('')}</div>`);},
  heliQuitarOk(x,t){const s=t.dataset.s,ids=enSitio(HELI+x).map(p=>p.id);cerrar();cambio('moverVarias',{ids,hasta:s,origen:s===SACA?'':'=',detalle:'Se quita el helicóptero '+x});ponerHelis(helis().filter(h=>h.cola!==x));toast('Hecho ✓');},
  instalarSaca(){const n=enSitio(SACA).length;if(!n){toast('La saca no tiene material');return;}
    elegirHeli('Instalar la saca',`El material de la saca amarilla (${pl(n,'pieza','piezas')}) pasa al helicóptero que elijas. Luego se devuelve con «Recoger saca».`,'','instalarSacaOk');},
  instalarSacaOk(){const c=heliElegido();if(!c){$('#eh-e').textContent='Elige o escribe el helicóptero.';return;}
    const ids=enSitio(SACA).map(p=>p.id);cerrar();asegurarHeli(c);cambio('moverVarias',{ids,hasta:HELI+c,origen:SACA,detalle:'Saca amarilla instalada en el '+c});toast('Saca instalada en el '+c+' ✓');},
  recogerSaca(){const ps=deSaca();if(!ps.length)return;if(!confirm(`¿Devolver a la saca amarilla ${pl(ps.length,'pieza','piezas')}?`))return;cerrar();cambio('moverVarias',{ids:ps.map(p=>p.id),hasta:SACA,origen:'',detalle:'Saca recogida'});toast('Saca recogida ✓');}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const f=A[t.dataset.a];if(f){e.preventDefault();f(t.dataset.x,t);}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.min!==undefined&&V.min){const m=V.min[Number(t.dataset.min)];if(m){m[t.dataset.col]=Math.max(0,Math.round(Number(t.value)||0));const b=$('[data-a=minGuardar]');if(b)b.disabled=false;}}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')cerrar();});
addEventListener('hashchange',()=>{if(tryLink())pull(true);cerrar();if(vista()!=='minimos')V.min=null;render();scrollTo(0,0);});
addEventListener('online',()=>pull());
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(S.url&&Date.now()-S.lastOk>20000)pull();comprobarVersion();});
// ¿hay una versión más nueva de la app publicada? Si la hay, se recarga sola cuando no estés a medias de algo.
let ultVer=0;
async function comprobarVersion(){
  if(Date.now()-ultVer<60000)return;ultVer=Date.now();
  try{const t=await(await fetch('./?'+Date.now())).text(),m=t.match(/const VER='([^']+)'/);if(m&&m[1]!==VER){nuevaVersion=true;render(true);}}catch(e){}
}
setTimeout(comprobarVersion,5000);

load();tryLink();render();
fotosCargar().then(()=>{render(true);if(S.url)pull();});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
