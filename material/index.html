<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Material GRUHEL</title>
<meta name="theme-color" content="#2f3b24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Material">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#eef0e8; --surface:#fff; --ink:#1b2114; --muted:#5d6650; --line:#d4d9c8;
  --accent:#3d4f2b; --accent-ink:#fff; --accent-soft:#e1e8d3; --gold:#b38a14;
  --ok:#1d7a4d; --ok-soft:#dcf1e6; --warn:#a85f00; --warn-soft:#fbebd0; --late:#b3261e; --late-soft:#f8dedb;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12160e; --surface:#1a2014; --ink:#e7eadf; --muted:#9aa38c; --line:#2c3423;
  --accent:#a9c47f; --accent-ink:#1a2210; --accent-soft:#283320; --gold:#e0b84a;
  --ok:#4cc38a; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#38290f; --late:#ff7a70; --late-soft:#3c1b19;
  color-scheme:dark;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.04em;text-transform:uppercase}
h2{font-size:21px} h3{font-size:15px;color:var(--muted);letter-spacing:.08em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:2px solid var(--ink);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.brand small{display:block;font:500 10px var(--body);letter-spacing:.14em;color:var(--muted);margin-top:2px}
#pill{font:600 11px var(--body);letter-spacing:.04em;padding:4px 9px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap;border:0;min-height:0}
#pill.pend{background:var(--warn-soft);color:var(--warn)} #pill.err{background:var(--late-soft);color:var(--late)}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(86px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;text-decoration:none;color:var(--muted);font:600 11px var(--body);letter-spacing:.02em}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current=page]{color:var(--accent)}
nav.tabs a .dot{position:absolute;margin-left:18px;margin-top:-2px;background:var(--late);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.hint{color:var(--muted);font-size:13px}
.sites{display:grid;gap:10px}
.site{border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:8px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.site.warn{border-left-color:var(--warn)} .site.late{border-left-color:var(--late)}
.site .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.site .t b{font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.site .meta{font-size:13px;color:var(--muted)}
.falta{font-size:13px;color:var(--late);font-weight:600}
.tag{display:inline-block;font:600 11px var(--body);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.late{background:var(--late-soft);color:var(--late)} .tag.n{background:transparent;border:1px solid var(--line);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.stat .v{font:600 26px var(--mono)} .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:6px;background:var(--warn-soft);font-size:14px;cursor:pointer}
.alert.late{background:var(--late-soft)}
.alert b{white-space:nowrap}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big button{min-height:56px;font-size:15px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item img,.item .noimg{width:54px;height:54px;border-radius:6px;object-fit:cover;flex:0 0 54px;background:var(--accent-soft)}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;font-size:14px;line-height:1.25}
.item .sub{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;align-items:center}
.item .id{font:600 12px var(--mono);color:var(--muted)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:0 0 auto;border-radius:99px;min-height:34px;padding:5px 12px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-height:44px}
textarea{min-height:70px;resize:vertical}
label{display:block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
button{font:600 14px var(--body);cursor:pointer;border-radius:6px;padding:9px 14px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--late);border-color:var(--late)}
button.small{min-height:32px;padding:4px 10px;font-size:13px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:36px;border-radius:99px;font-size:13px;padding:5px 12px;flex:0 0 auto}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.check img,.check .noimg{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:0 0 44px;background:var(--accent-soft)}
.check .main{flex:1;min-width:0;font-size:14px}
.tog{display:flex;gap:4px}
.tog button{min-height:40px;min-width:48px;padding:4px 8px;font-size:13px}
.tog button.on.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.tog button.on.nob{background:var(--late);border-color:var(--late);color:#fff}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,10,5,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .box>header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.x{min-height:36px;padding:2px 12px}
.photo{width:100%;max-height:260px;object-fit:contain;background:var(--accent-soft);border-radius:8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:14px}
dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
dd{margin:0;word-break:break-word}
.consid{background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:13px;margin:8px 0}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
#toast.on{opacity:1}
.err{color:var(--late);font-size:13px}
.setup{max-width:520px;margin:40px auto;text-align:center}
.vrow{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.vrow:last-child{border-bottom:0}
.vrow .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Material<small>SAER · GRUHEL</small></div>
  <button id="pill" type="button">…</button>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs" hidden>
  <a href="#inicio" data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="#material" data-v="material"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="5"/><path d="M15.5 8.5l-1.2 6"/></svg>Material</a>
  <a href="#revisar" data-v="revisar"><svg viewBox="0 0 24 24"><path d="M9 4h6M8 3h8v3H8z"/><rect x="5" y="4.5" width="14" height="17" rx="2"/><path d="M8.5 13l2.5 2.5 4.5-5"/></svg>Revisar</a>
  <a href="#incidencias" data-v="incidencias"><svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.1"/></svg>Incidencias</a>
  <a href="#mas" data-v="mas"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Más</a>
</nav>
<div class="sheet" id="sheet"><div class="box" id="sbox"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script>
'use strict';
const KEY='material-gruhel-v1';
const SITIOS=['HELICÓPTERO','SACA AMARILLA','OFICINA (REPUESTO)'];
const CORTO={'HELICÓPTERO':'Helicóptero','SACA AMARILLA':'Saca amarilla','OFICINA (REPUESTO)':'Oficina'};
const BLOQUEA=['PRESTADO · PEND. DEVOLUCIÓN','EN REPARACIÓN','DAÑADO · NO USAR','PERDIDO','BAJA'];
const QUE=['PRESTADO · PEND. DEVOLUCIÓN','EN REPARACIÓN','DAÑADO · NO USAR','PERDIDO','PEDIR REPOSICIÓN','DEVUELTO / RECUPERADO','REPARADO','BAJA','OTRO'];
const PED_EST=['PENDIENTE DE PEDIR','SOLICITADO A MATERIAL','RECIBIDO PARCIAL','RECIBIDO','ANULADO'];
let S={url:'',token:'',quien:'',data:null,fotos:{},pend:[],lastOk:0,err:''};
let V={filtro:'HELICÓPTERO',q:'',rev:null};

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmt(iso){if(!iso||!/^\d{4}-\d\d-\d\d/.test(iso))return iso||'';const[a,m,d]=iso.slice(0,10).split('-');return d+'/'+m+'/'+a;}
function dias(iso){if(!/^\d{4}-\d\d-\d\d/.test(iso||''))return null;return Math.round((new Date(iso.slice(0,10)+'T12:00')-new Date(hoy()+'T12:00'))/864e5);}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){try{const c={...S,fotos:{}};localStorage.setItem(KEY,JSON.stringify(c));}catch(_){}}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j)S={...S,...j};}catch(e){}}

/* ---------- modelo ---------- */
const D=()=>S.data||{inventario:[],catalogo:[],minimos:[],revisiones:[],vicisitudes:[],pedidos:[]};
function cat(cod){return D().catalogo.find(c=>c.cod===cod)||{};}
function pieza(id){return D().inventario.find(p=>p.id===id);}
function nombre(p){const c=cat(p.cod);return c.desc||p.cod||p.id;}
function foto(p){return S.fotos[p.id]||S.fotos[p.cod]||'';}
function abiertas(id){return D().vicisitudes.filter(v=>v.id===id&&v.resuelto!=='SÍ');}
function situacion(p){
  if(p.estado&&p.estado!=='OK')return p.estado;
  const ab=abiertas(p.id).filter(v=>BLOQUEA.includes(v.que));
  return ab.length?ab[ab.length-1].que:'OK';
}
function cadu(p){
  const c=String(p.caduca||'').trim();
  if(!c)return{t:'Sin dato',k:'n'};
  if(/ON CONDITION/i.test(c))return{t:'On condition',k:'n'};
  const d=dias(c); if(d===null)return{t:c,k:'n'};
  if(d<0)return{t:'Caducado '+fmt(c),k:'late',d};
  if(d<365)return{t:'Caduca '+fmt(c),k:'warn',d};
  return{t:'Caduca '+fmt(c).slice(3),k:'ok',d};
}
function disponible(p){return situacion(p)==='OK'&&cadu(p).k!=='late';}
function activas(){return D().inventario.filter(p=>situacion(p)!=='BAJA');}
function sitTag(s){const k=s==='OK'?'ok':(s.startsWith('PRESTADO')||s==='EN REPARACIÓN'?'warn':'late');return `<span class="tag ${k}">${esc(s==='PRESTADO · PEND. DEVOLUCIÓN'?'Prestado':s)}</span>`;}
function ultimaRev(sitio){const r=D().revisiones.filter(r=>r.sitio===sitio&&r.fecha);return r.length?r.sort((a,b)=>a.fecha<b.fecha?-1:1)[r.length-1]:null;}
function minimos(sitio){
  const col=sitio==='HELICÓPTERO'?'heli':sitio==='SACA AMARILLA'?'saca':null; if(!col)return[];
  return D().minimos.filter(m=>Number(m[col])>0).map(m=>{
    const hay=D().inventario.filter(p=>p.asignado===sitio&&cat(p.cod).tipo===m.tipo&&disponible(p)).length;
    return{tipo:m.etiqueta||m.tipo,min:Number(m[col]),hay};
  });
}

/* ---------- conexión ---------- */
function conectarCon(txt){
  const m=String(txt||'').match(/conectar=([A-Za-z0-9+/=%_-]+)/);if(!m)return false;
  try{let b=decodeURIComponent(m[1]).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const j=JSON.parse(atob(b));if(j.u&&j.t){S.url=j.u;S.token=j.t;S.data=null;S.fotos={};save();return true;}}catch(e){}
  return false;
}
function tryLink(){
  if(!/conectar=/.test(location.hash))return false;
  const ok=conectarCon(location.hash);
  history.replaceState(null,'',location.pathname+'#inicio');
  if(!ok)toast('El enlace está incompleto. Pégalo entero abajo.');
  return ok;
}
async function apiGet(action){
  const u=new URL(S.url);u.searchParams.set('app','mat');u.searchParams.set('action',action);u.searchParams.set('token',S.token);u.searchParams.set('_',Date.now());
  const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j;
}
async function apiPost(action,payload){
  const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({app:'mat',token:S.token,action,payload})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();if(!j.ok){const e=new Error(j.error||'error');e.server=true;throw e;}return j;
}
let pulling=false;
async function pull(fotos){
  if(pulling)return;pulling=true;
  try{
    await drain();
    if(S.pend.length)throw new Error('pendiente');
    const j=await apiGet('todo');
    S.quien=j.quien;S.data={inventario:j.inventario,catalogo:j.catalogo,minimos:j.minimos,revisiones:j.revisiones,vicisitudes:j.vicisitudes,pedidos:j.pedidos};
    if(fotos||!Object.keys(S.fotos).length){const f=await apiGet('fotos');S.fotos=f.fotos||{};}
    S.lastOk=Date.now();S.err='';save();render();
  }catch(e){if(e.message!=='pendiente'){S.err=e.message;}pill();}
  finally{pulling=false;}
}
async function drain(){
  while(S.pend.length){
    const op=S.pend[0];
    try{await apiPost(op.a,op.p);S.pend.shift();save();}
    catch(e){if(e.server){S.pend.shift();save();toast('No se pudo guardar: '+e.message);}else{S.err='sin conexión';pill();return;}}
  }
}
// aplica el cambio en el móvil al momento y lo manda a la hoja (o lo deja en cola sin cobertura)
function cambio(a,p){
  aplicar(a,p);S.pend.push({a,p});save();render();
  drain().then(()=>{if(!S.pend.length)pull(a==='setFoto');});
}
function aplicar(a,p){
  const d=D();
  if(a==='addRevision')d.revisiones.push({fecha:hoy(),quien:p.quien,sitio:p.sitio,ok:p.ok,obs:p.obs});
  if(a==='addVicisitud'){
    const cierra=['DEVUELTO / RECUPERADO','REPARADO'].includes(p.que),info=['CAMBIO DE UBICACIÓN','ALTA NUEVA','OTRO'].includes(p.que);
    if(cierra)d.vicisitudes.forEach(v=>{if(v.id===p.id&&v.resuelto!=='SÍ'){v.resuelto='SÍ';v.fres=hoy();}});
    d.vicisitudes.push({fecha:hoy(),id:p.id,que:p.que,donde:p.donde,detalle:p.detalle,resuelto:cierra||info?'SÍ':'NO',fres:cierra||info?hoy():'',quien:S.quien});
    const pz=pieza(p.id);
    if(pz&&p.que==='CAMBIO DE UBICACIÓN'&&SITIOS.includes(p.donde))pz.asignado=p.donde;
    if(pz&&p.que==='BAJA')pz.estado='BAJA';
  }
  if(a==='resolver'){const v=d.vicisitudes.find(v=>v._r===p._r&&v.id===p.id);if(v){v.resuelto='SÍ';v.fres=hoy();}}
  if(a==='updatePieza'){const pz=pieza(p.id);if(pz)Object.assign(pz,p.fields);}
  if(a==='updatePedido'){const x=d.pedidos.find(x=>x.id===p.id);if(x)Object.assign(x,p.fields);}
  if(a==='addPedido')d.pedidos.push({...p,id:'P··',fecha:hoy()});
  if(a==='setFoto')S.fotos[p.k]=p.v;
}
function pill(){
  const e=$('#pill');
  if(!S.url){e.textContent='Sin conectar';e.className='err';return;}
  if(S.pend.length){e.textContent='⏳ '+S.pend.length+' sin enviar';e.className='pend';return;}
  if(S.err){e.textContent='⚠ Sin conexión';e.className='pend';return;}
  e.textContent='✓ '+(S.quien?S.quien.charAt(0)+S.quien.slice(1).toLowerCase():'Guardado');e.className='';
}

/* ---------- vistas ---------- */
function vista(){return(location.hash.replace('#','').split('/')[0])||'inicio';}
function render(){
  pill();
  const app=$('#app');
  if(!S.url){$('#tabs').hidden=true;app.innerHTML=`<div class="setup panel"><h2>Material GRUHEL</h2><p>Abre el <b>enlace de conexión</b> que te han pasado, o <b>pégalo aquí</b> entero. Solo hace falta la primera vez.</p>
  <textarea id="link" placeholder="https://dbdkoi.github.io/…#conectar=…" style="min-height:90px"></textarea>
  <button class="primary" style="width:100%;margin-top:10px" id="conectar">Conectar</button><p class="err" id="link-e"></p></div>`;
  $('#conectar').onclick=()=>{if(conectarCon($('#link').value)){render();pull(true);}else $('#link-e').textContent='No reconozco el enlace: cópialo completo, incluida la parte "#conectar=…".';};
  return;}
  $('#tabs').hidden=false;
  if(!S.data){app.innerHTML=`<div class="empty">Cargando el material…${S.err?'<br><span class="err">'+esc(S.err)+'</span>':''}</div>`;return;}
  const v=vista();
  const tab={pedidos:'mas',catalogo:'mas'}[v]||v;
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.dataset.v===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const nab=D().vicisitudes.filter(x=>x.resuelto!=='SÍ').length;
  const ti=document.querySelector('#tabs a[data-v=incidencias]');ti.querySelector('.dot')?.remove();if(nab)ti.insertAdjacentHTML('beforeend',`<span class="dot">${nab}</span>`);
  ({inicio:vInicio,material:vMaterial,revisar:vRevisar,incidencias:vIncid,mas:vMas,pedidos:vPedidos,catalogo:vCatalogo}[v]||vInicio)(app);
}

function vInicio(app){
  const act=activas();
  const sites=SITIOS.map(s=>{
    const r=ultimaRev(s),d=r?-dias(r.fecha):null;
    const mins=minimos(s),faltan=mins.filter(m=>m.hay<m.min);
    const n=act.filter(p=>p.asignado===s),nd=n.filter(disponible).length;
    let k='ok';if(faltan.length||(r&&r.ok==='NO'))k='late';else if(!r||d>45)k='warn';
    return `<div class="site ${k}">
      <div class="t"><b>${CORTO[s]}</b><button class="small primary" data-rev="${esc(s)}">Revisar</button></div>
      <div class="meta">${r?`Última revisión: <b>${fmt(r.fecha)}</b> (hace ${d} día${d===1?'':'s'}) · ${esc(r.quien)} · ${r.ok==='SÍ'?'todo OK':'<b style="color:var(--late)">faltaba algo</b>'}`:'Sin revisar todavía'}</div>
      <div class="meta">${nd} de ${n.length} piezas disponibles</div>
      ${faltan.length?`<div class="falta">Falta para el mínimo: ${faltan.map(f=>esc(f.tipo.toLowerCase())+` (${f.hay}/${f.min})`).join(', ')}</div>`:(mins.length?'<div class="meta" style="color:var(--ok)">Mínimos completos</div>':'')}
    </div>`;}).join('');
  const al=[];
  D().vicisitudes.filter(v=>v.resuelto!=='SÍ').forEach(v=>{const p=pieza(v.id);al.push({k:BLOQUEA.includes(v.que)&&v.que!=='PRESTADO · PEND. DEVOLUCIÓN'?'late':'',h:`<b>${esc(v.id)}</b> ${esc(v.que.toLowerCase())}${v.donde?' · '+esc(v.donde):''} — ${esc(p?nombre(p):'')}`,go:'#incidencias'});});
  act.forEach(p=>{const c=cadu(p);if(c.k==='late'||c.k==='warn')al.push({k:c.k==='late'?'late':'',h:`<b>${esc(p.id)}</b> ${esc(c.t)} — ${esc(nombre(p))}`,go:'ficha:'+p.id});});
  const pend=D().pedidos.filter(x=>['PENDIENTE DE PEDIR','SOLICITADO A MATERIAL','RECIBIDO PARCIAL'].includes(x.estado));
  const npedir=pend.filter(x=>x.estado==='PENDIENTE DE PEDIR').length;
  app.innerHTML=`
  <div class="big"><button class="primary" data-go="#revisar">✓ Revisar material</button><button data-nueva>⚠ Anotar incidencia</button></div>
  <div class="sites">${sites}</div>
  <section class="panel"><header><h2>Avisos</h2><span class="hint">${al.length||'ninguno'}</span></header>
    <div class="alerts">${al.map(a=>`<div class="alert ${a.k}" data-go="${a.go}">${a.h}</div>`).join('')||'<div class="hint">Todo en orden.</div>'}</div></section>
  <div class="stats">
    <div class="stat"><div class="v">${act.length}</div><div class="l">Piezas</div></div>
    <div class="stat"><div class="v">${act.filter(disponible).length}</div><div class="l">Disponibles</div></div>
    <div class="stat" data-go="#pedidos" style="cursor:pointer"><div class="v">${pend.length}</div><div class="l">Pedidos abiertos${npedir?` · ${npedir} por pedir`:''}</div></div>
  </div>`;
}

    <div class="tog"><button class="okb ${m==='ok'?'on':''}" data-mk="${esc(p.id)}" data-val="ok" aria-label="Está">✓</button><button class="nob ${m==='no'?'on':''}" data-mk="${esc(p.id)}" data-val="no" aria-label="Falta">✗</button></div></div>`;}).join('')}</div>
  <label for="rev-obs">Observaciones</label><textarea id="rev-obs" placeholder="Opcional">${esc(R.obs)}</textarea>
  <label><input type="checkbox" id="rev-junto" ${R.junto?'checked':''} style="width:auto;min-height:0;margin-right:6px">Revisado con ${S.quien==='DAVID'?'Alberto':'David'}</label>
  <button class="primary" style="width:100%;margin-top:12px" data-guardarev ${marcadas<l.length?'':''}>Guardar revisión</button></section>`;
  $('#rev-obs').oninput=e=>R.obs=e.target.value;

function guardarRev(){
  const R=V.rev,l=D().inventario.filter(p=>p.asignado===R.sitio&&situacion(p)!=='BAJA');
  const sin=l.filter(p=>!R.m[p.id]);
  if(sin.length&&!confirm(`Quedan ${sin.length} piezas sin marcar. ¿Guardar igualmente?`))return;
  const faltan=l.filter(p=>R.m[p.id]==='no');
  const obs=[faltan.length?'Falta / revisar: '+faltan.map(p=>p.id+' '+nombre(p)).join('; '):'',sin.length?'Sin comprobar: '+sin.map(p=>p.id).join(', '):'',R.obs].filter(Boolean).join(' | ');
  cambio('addRevision',{sitio:R.sitio,ok:faltan.length?'NO':'SÍ',obs,quien:R.junto?'ALBERTO Y DAVID':S.quien});
  V.rev=null;toast(faltan.length?'Revisión guardada. Si falta algo, anótalo como incidencia.':'Revisión guardada ✓');
  if(faltan.length===1)setTimeout(()=>abrirIncid(faltan[0].id),400);
  render();
}

  <label for="a-n">Estiba / notas</label><textarea id="a-n"></textarea>
  <label for="a-d">Origen (albarán, pedido…)</label><input id="a-d">
  <p class="err" id="a-e"></p><button class="primary" style="width:100%" data-guardaralta>Dar de alta</button>`);
}
async function guardarAlta(btn){
  const cod=$('#a-c').value;if(!cod){$('#a-e').textContent='Elige la referencia.';return;}
  btn.disabled=true;btn.textContent='Guardando…';
  try{const r=await apiPost('addPieza',{cod,asignado:$('#a-u').value,serie:$('#a-s').value.trim(),fab:$('#a-f').value.trim(),caduca:$('#a-oc').checked?'ON CONDITION':$('#a-k').value,notas:$('#a-n').value.trim(),detalle:$('#a-d').value.trim()||'Alta desde la app'});
    cerrar();toast('Alta '+r.result.id+' ✓');await pull();}
  catch(e){$('#a-e').textContent='No se pudo: '+e.message;btn.disabled=false;btn.textContent='Dar de alta';}
}
function abrirPedido(id){
  const x=D().pedidos.find(x=>x.id===id);if(!x)return;
  sheet(`<header><h2>${esc(x.material)}</h2><button class="x" data-cerrar>Cerrar</button></header>
  ${S.fotos[x.id]?`<img class="photo" src="${S.fotos[x.id]}" alt="">`:''}
  <dl><dt>Modelo</dt><dd>${esc(x.modelo)}</dd><dt>P/N</dt><dd class="num">${esc(x.pn)}</dd><dt>Cantidad</dt><dd>${esc(x.cant)}</dd><dt>Solicitado</dt><dd>${fmt(x.fecha)}</dd><dt>Vida útil</dt><dd>${esc(x.vida)}</dd></dl>
  <label>Estado</label><div class="chips" id="p-e">${PED_EST.map(e=>`<button type="button" data-e="${e}" aria-pressed="${x.estado===e}">${e.charAt(0)+e.slice(1).toLowerCase()}</button>`).join('')}</div>
  <label for="p-n">Notas / destino</label><textarea id="p-n">${esc(x.notas)}</textarea>
  <button class="primary" style="width:100%;margin-top:12px" data-guardarped="${esc(id)}">Guardar</button>
  <button style="width:100%;margin-top:8px" data-alta="${esc((D().catalogo.find(c=>c.pn&&x.pn&&String(c.pn).includes(String(x.pn)))||{}).cod||'')}">＋ Dar de alta en inventario lo recibido</button>`);
  $('#p-e').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#p-e').querySelectorAll('button').forEach(z=>z.setAttribute('aria-pressed',z===b));};
}
function guardarPed(id){
  const x=D().pedidos.find(x=>x.id===id);const est=$('#p-e [aria-pressed=true]')?.dataset.e||x.estado,notas=$('#p-n').value.trim();
  const fields={};if(est!==x.estado)fields.estado=est;if(notas!==String(x.notas||''))fields.notas=notas;
  if(Object.keys(fields).length)cambio('updatePedido',{id,fields});cerrar();toast('Guardado ✓');
}
function abrirPedidoNuevo(){
  sheet(`<header><h2>Nuevo pedido</h2><button class="x" data-cerrar>Cerrar</button></header>
  <label for="n-c">Del catálogo</label><select id="n-c"><option value="">— Escribir a mano —</option>${D().catalogo.map(c=>`<option value="${esc(c.cod)}">${esc(c.desc)}</option>`).join('')}</select>
  <label for="n-m">Material</label><input id="n-m"><label for="n-p">P/N</label><input id="n-p">
  <div class="row"><div><label for="n-q">Cantidad</label><input id="n-q" type="number" min="1" value="1" inputmode="numeric"></div><div><label for="n-e">Estado</label><select id="n-e">${PED_EST.slice(0,2).map(e=>`<option>${e}</option>`).join('')}</select></div></div>
  <label for="n-n">Notas / destino</label><textarea id="n-n"></textarea><p class="err" id="n-x"></p>
  <button class="primary" style="width:100%" data-guardarpednuevo>Guardar pedido</button>`);
  $('#n-c').onchange=e=>{const c=cat(e.target.value);if(c.cod){$('#n-m').value=c.desc;$('#n-p').value=c.pn;}};
}
function guardarPedNuevo(){
  const c=cat($('#n-c').value),material=$('#n-m').value.trim();
  if(!material){$('#n-x').textContent='Pon qué material.';return;}
  cambio('addPedido',{material,modelo:c.desc||'',pn:$('#n-p').value.trim(),cant:Number($('#n-q').value)||1,estado:$('#n-e').value,vida:c.vida||'',notas:$('#n-n').value.trim()});
  cerrar();toast('Pedido anotado ✓');
}
function abrirCat(cod){
  const c=cat(cod),ps=D().inventario.filter(p=>p.cod===cod);
  sheet(`<header><h2>${esc(cod)}</h2><button class="x" data-cerrar>Cerrar</button></header>
  ${S.fotos[cod]?`<img class="photo" src="${S.fotos[cod]}" alt="">`:''}<h3 style="margin-top:10px;color:var(--ink);font-size:17px">${esc(c.desc)}</h3>
  ${c.consid?`<div class="consid">⚠ ${esc(c.consid)}</div>`:''}
  <dl><dt>P/N</dt><dd class="num">${esc(c.pn)}</dd><dt>Vida útil</dt><dd>${esc(c.vida)}</dd><dt>Tipo</dt><dd>${esc(c.tipo)}</dd></dl>
  <h3>En inventario</h3>${ps.map(itemHTML).join('')||'<div class="hint">Ninguna pieza.</div>'}`);
}
let fotoPara=null;
$('#cam').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!fotoPara)return;
  try{
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(f);});
    let max=360,q=.7,url='';
    for(let k=0;k<6;k++){const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);url=cv.toDataURL('image/jpeg',q);if(url.length<45000)break;max*=.85;q-=.08;}
    cambio('setFoto',{k:fotoPara,v:url});abrirFicha(fotoPara);toast('Foto guardada ✓');
  }catch(err){toast('No se pudo leer la foto');}
};

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-ficha],[data-rev],[data-nueva],[data-f],[data-mk],[data-todook],[data-cancel],[data-guardarev],[data-resolver],[data-cerrar],[data-guardarinc],[data-mover],[data-movera],[data-editar],[data-guardaredit],[data-foto],[data-alta],[data-guardaralta],[data-pedido],[data-guardarped],[data-pedido-nuevo],[data-guardarpednuevo],[data-cat],[data-recargar],#pill');
  if(!t)return;const d=t.dataset;
  if(t.id==='pill'){pull(true);toast('Sincronizando…');return;}
  if(d.go!==undefined){if(d.go.startsWith('ficha:'))abrirFicha(d.go.slice(6));else{cerrar();location.hash=d.go;}return;}
  if(d.ficha!==undefined){abrirFicha(d.ficha);return;}
  if(d.rev!==undefined){V.rev={sitio:d.rev,m:{},obs:'',junto:false};if(vista()==='revisar')render();else location.hash='#revisar';return;}
  if(d.nueva!==undefined){abrirIncid(d.nueva||'');return;}
  if(d.f!==undefined){V.filtro=d.f;render();return;}
  if(d.mk!==undefined){V.rev.m[d.mk]=V.rev.m[d.mk]===d.val?undefined:d.val;const y=scrollY;render();scrollTo(0,y);return;}
  if(d.todook!==undefined){D().inventario.filter(p=>p.asignado===V.rev.sitio).forEach(p=>{if(!V.rev.m[p.id])V.rev.m[p.id]='ok';});const y=scrollY;render();scrollTo(0,y);return;}
  if(d.cancel!==undefined){V.rev=null;render();return;}
  if(d.guardarev!==undefined){guardarRev();return;}
  if(d.resolver!==undefined){if(confirm('¿Marcar como resuelta?'))cambio('resolver',{_r:Number(d.resolver),id:d.id});return;}
  if(d.cerrar!==undefined){cerrar();return;}
  if(d.guardarinc!==undefined){guardarInc();return;}
  if(d.mover!==undefined){abrirMover(d.mover);return;}
  if(d.movera!==undefined){cambio('addVicisitud',{id:d.id,que:'CAMBIO DE UBICACIÓN',donde:d.movera,detalle:$('#m-t').value.trim()});abrirFicha(d.id);toast('Movido a '+CORTO[d.movera]+' ✓');return;}
  if(d.editar!==undefined){abrirEditar(d.editar);return;}
  if(d.guardaredit!==undefined){guardarEdit(d.guardaredit);return;}
  if(d.foto!==undefined){fotoPara=d.foto;$('#cam').click();return;}
  if(d.alta!==undefined){abrirAlta(d.alta);return;}
  if(d.guardaralta!==undefined){guardarAlta(t);return;}
  if(d.pedido!==undefined){abrirPedido(d.pedido);return;}
  if(d.guardarped!==undefined){guardarPed(d.guardarped);return;}
  if(d.pedidoNuevo!==undefined){abrirPedidoNuevo();return;}
  if(d.guardarpednuevo!==undefined){guardarPedNuevo();return;}
  if(d.cat!==undefined){abrirCat(d.cat);return;}
  if(d.recargar!==undefined){pull(true);toast('Recargando…');return;}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')cerrar();});
addEventListener('hashchange',()=>{if(tryLink()){pull(true);}cerrar();render();scrollTo(0,0);});
addEventListener('online',()=>pull());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.url)pull();});

load();tryLink();render();if(S.url)pull();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
