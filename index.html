<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232e18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logbook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Logbook v2. Una columna de tarjetas; el contador de horas sobre verde oliva es el único elemento fuerte.
   Barra de pestañas abajo en móvil, arriba en pantallas anchas. */
:root{
  --bg:#e9ede0; --surface:#fbfcf8; --ink:#1a2013; --muted:#5f6954; --line:#d2d8c4;
  --accent:#3d4f2b; --accent-ink:#ffffff; --soft:#dde5cf;
  --hero:#232e18; --hero-2:#2e3c20; --hero-ink:#eef2e4; --hero-mut:#a9b598; --hero-col:#5b7340; --hero-on:#d9c27a;
  --a1:#c2a865; --a2:#7d9a52; --a3:#3d4f2b; --a4:#8a8f7c;
  --ok:#1d7a4d; --ok-soft:#dcf1e6; --warn:#9a5700; --warn-soft:#fbebd0; --late:#b3261e; --late-soft:#f8dedb;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f130b; --surface:#181f12; --ink:#e6eadc; --muted:#98a28a; --line:#2b3422;
    --accent:#a9c47f; --accent-ink:#17200d; --soft:#243019;
    --hero:#1e2a14; --hero-2:#27351a; --hero-col:#4c6335; --hero-on:#d9c27a;
    --a1:#cdb574; --a2:#7f9e54; --a3:#b9d48f; --a4:#7d8372;
    --ok:#4cc38a; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#38290f; --late:#ff7a70; --late-soft:#3c1b19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f130b; --surface:#181f12; --ink:#e6eadc; --muted:#98a28a; --line:#2b3422;
  --accent:#a9c47f; --accent-ink:#17200d; --soft:#243019;
  --hero:#1e2a14; --hero-2:#27351a; --hero-col:#4c6335; --hero-on:#d9c27a;
  --a1:#cdb574; --a2:#7f9e54; --a3:#b9d48f; --a4:#7d8372;
  --ok:#4cc38a; --ok-soft:#14301f; --warn:#f0b04a; --warn-soft:#38290f; --late:#ff7a70; --late-soft:#3c1b19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;letter-spacing:.01em}
h2{font-size:23px;line-height:1.1}
h3{font-size:19px}
a{color:var(--accent)}
.n{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* cabecera */
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:calc(8px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));min-height:52px}
.brand{font:700 25px/1 var(--display);letter-spacing:.09em;margin-right:auto}
.sync{display:inline-flex;align-items:center;gap:6px;min-height:34px;min-width:34px;justify-content:center;padding:0 8px;border-radius:99px;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);cursor:pointer}
.sync.idle{visibility:hidden}
.sync svg.i{width:19px;height:19px}
.sync.busy svg.i{animation:giro 1s linear infinite}
.sync.ok{color:var(--ok)} .sync.warn{color:var(--warn);background:var(--warn-soft)} .sync.err{color:var(--late);background:var(--late-soft)}
@keyframes giro{to{transform:rotate(360deg)}}

/* pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:0 max(6px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(6px,env(safe-area-inset-left))}
nav.tabs a{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font:500 12.5px var(--body);position:relative}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs a.add span.plus{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px;border:4px solid var(--surface);box-sizing:content-box}
nav.tabs a.add span.plus svg.i{width:26px;height:26px;stroke-width:2.2}
nav.tabs a.add::before{display:none}
nav.tabs a .dot{position:absolute;top:9px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--late);border:2px solid var(--surface);box-sizing:content-box}
nav.tabs a .dot.warn{background:var(--warn)}

main{max-width:760px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) calc(var(--nav-h) + 34px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){
  nav.tabs{position:static;border:0;background:none;display:flex;gap:4px;padding:0}
  nav.tabs a{height:40px;flex-direction:row;gap:7px;padding:0 12px;font-size:15px;border-radius:8px}
  nav.tabs a[aria-current="page"]{background:var(--soft)}
  nav.tabs a[aria-current="page"]::before{display:none}
  nav.tabs a.add span.plus{width:28px;height:28px;margin:0;border:0}
  nav.tabs a.add span.plus svg.i{width:18px;height:18px}
  nav.tabs a .dot{top:6px;left:24px}
  .brand{margin-right:10px}
  .sync{margin-left:auto}
  main{padding-bottom:60px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.hint{color:var(--muted);font-size:14px}
.banner{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:15px}
.banner.late{border-color:var(--late);background:var(--late-soft)}

/* contador de horas */
.hero{background:linear-gradient(170deg,var(--hero-2),var(--hero) 55%);color:var(--hero-ink);border-radius:20px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font:500 15px var(--body);color:var(--hero-mut)}
.hero .total{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero .val{font:700 clamp(68px,21vw,104px)/.82 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.005em}
.hero .val small{font-size:.5em;font-weight:600;color:var(--hero-mut)}
.hero .side{font-size:15px;color:var(--hero-mut);line-height:1.35;display:flex;flex-wrap:wrap;gap:0 16px;flex:1 1 100%}
@media (min-width:560px){.hero .side{flex:0 1 auto;flex-direction:column;align-items:flex-end}}
.hero .side b{color:var(--hero-ink);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:112px;padding-top:16px}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;background:none;border:0;padding:0;cursor:pointer;color:var(--hero-mut);font:500 12px var(--body)}
.col i{display:block;border-radius:4px 4px 1px 1px;background:var(--hero-col);min-height:3px}
.col.on i{background:var(--hero-on)}
.col.on{color:var(--hero-ink)}
.col b{display:block;text-align:center;margin:0 -6px 3px;font:600 13px/1 var(--display);color:var(--hero-ink)}
.col span{display:block;text-align:center;padding-top:5px;line-height:1}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.14);padding-top:11px;font-size:15px;min-height:42px}
.pick b{font-weight:600}
.pick a{color:var(--hero-on);font-weight:600;text-decoration:none;white-space:nowrap}
.win{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.win div{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px}
.win span{display:block;font-size:13px;color:var(--hero-mut)}
.win b{font:600 23px/1.1 var(--display);font-variant-numeric:tabular-nums}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:1px;text-decoration:none;color:inherit;min-width:0}
.stat .k{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font:600 31px/1.05 var(--display);font-variant-numeric:tabular-nums}
.stat .s{font-size:14px;color:var(--muted)}
.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)} .stat.late .v{color:var(--late)}
.stat.warn{border-color:var(--warn)} .stat.late{border-color:var(--late)}
.stat svg.i{width:17px;height:17px}

/* reparto por aeronave */
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin-bottom:6px}
.split i{display:block;min-width:4px}
.ac{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.ac:last-child{border-bottom:0;padding-bottom:0}
.ac .sw{width:12px;height:12px;border-radius:3px;align-self:center}
.ac .nm{font-weight:600;font-size:17px}
.ac .hr{font:600 25px/1 var(--display);font-variant-numeric:tabular-nums}
.ac .meta{grid-column:2 / 4;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
.ac .meta b{font-weight:600;color:var(--ink)}

.rows{display:flex;flex-direction:column;gap:11px}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.rw .t{min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw .x{font:600 18px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rw .x small{font:400 13px var(--body);color:var(--muted);margin-left:6px}
.rw .track{grid-column:1 / 3;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.rw .fill{display:block;height:100%;background:var(--accent);border-radius:4px;min-width:3px}
.tag{display:inline-block;font:600 13px/1 var(--display);letter-spacing:.05em;padding:4px 7px 3px;border-radius:5px;background:var(--soft);color:var(--ink);margin-right:7px;vertical-align:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend b{color:var(--ink);font-weight:600}

/* lista de vuelos */
.search{display:flex;gap:8px}
.search input{flex:1}
.chipsrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chipsrow::-webkit-scrollbar{display:none}
.chipb{flex:0 0 auto;font:500 15px var(--body);padding:7px 13px;min-height:38px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chipb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.mon{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 0;gap:10px}
.mon h3{text-transform:capitalize}
.mon span{font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.fl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 12px;cursor:pointer}
.fl.sim{border-style:dashed}
.fl .d{grid-row:1 / 3;text-align:center;align-self:start;border-right:1px solid var(--line);padding-right:10px}
.fl .d b{display:block;font:700 27px/1 var(--display)}
.fl .d span{display:block;font-size:13px;color:var(--muted)}
.fl .t{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .h{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.fl .m{grid-column:2 / 4;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:1px 12px}
.fl .m b{color:var(--ink);font-weight:500}
.fl .more{grid-column:1 / 4;border-top:1px solid var(--line);margin-top:9px;padding-top:10px;font-size:15px;display:flex;flex-direction:column;gap:6px;cursor:auto}
.fl .more dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px}
.fl .more dt{color:var(--muted)} .fl .more dd{margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font:500 13px var(--body);padding:2px 9px;border-radius:99px;background:var(--soft)}
.badge.r{background:var(--warn-soft);color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}

/* formularios */
form.grid,.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:span 6;min-width:0}
.fld.h{grid-column:span 3} .fld.t{grid-column:span 2}
label,.lab{font:600 14px var(--body);color:var(--muted)}
input,select,textarea{font:17px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
textarea{resize:vertical;min-height:76px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick .chipb{font-size:14px;padding:4px 11px;min-height:32px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{border:0;border-radius:0;background:none;min-height:44px;padding:0 6px;font:500 16px var(--body);color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.step input{border:0;border-radius:0;text-align:center;padding:0;background:none;font:600 22px var(--display);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.step button{border:0;border-radius:0;background:var(--soft);font:600 22px var(--display);min-height:46px;padding:0;color:var(--ink);cursor:pointer}
.misdesc{font-size:14px;color:var(--muted);min-height:1.3em}
.err{color:var(--late);font-size:15px;min-height:1.2em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,.btn{font:600 16px var(--body);cursor:pointer;border-radius:10px;padding:10px 18px;min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--late);border-color:var(--late)}
button.small{padding:6px 13px;min-height:36px;font-size:15px}
button.wide{flex:1}
button:disabled{opacity:.5}

/* piloto */
.valid .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.valid .big{font:700 52px/.9 var(--display);font-variant-numeric:tabular-nums}
.valid .big small{font:500 17px var(--body);color:var(--muted);margin-left:6px}
.valid.ok .big{color:var(--ok)} .valid.warn .big{color:var(--warn)} .valid.late .big{color:var(--late)}
.life{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:12px 0 8px}
.life i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.valid.warn .life i{background:var(--warn)} .valid.late .life i{background:var(--late)}
.ends{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.pill{font:600 14px var(--body);padding:3px 11px;border-radius:99px;white-space:nowrap}
.ok .pill{background:var(--ok-soft);color:var(--ok)} .warn .pill{background:var(--warn-soft);color:var(--warn)} .late .pill{background:var(--late-soft);color:var(--late)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0;padding-bottom:0} .kv:first-child{padding-top:0}
.kv .a{font-weight:600} .kv .b{font-size:14px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0 0 0 6px}
.tl li{position:relative;padding:0 0 18px 24px;border-left:2px solid var(--line)}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-8px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.tit::before{background:var(--accent);width:14px;height:14px;left:-10px;top:0}
.tl .when{font:600 17px/1.1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.tl .when small{font:400 14px var(--body);margin-left:8px}
.tl .what{font-weight:600;font-size:17px;line-height:1.25;margin:3px 0 2px}
.tl .kind{font-size:14px;color:var(--accent);font-weight:600}
.tl .det{font-size:14.5px;color:var(--muted);white-space:pre-line;margin-top:4px}
.tl button{margin-top:4px;border:0;background:none;padding:0;min-height:34px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

#modal{position:fixed;inset:0;background:rgba(8,12,5,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-width:560px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){#modal{align-items:center;padding:16px}#modal .box{border-radius:18px;padding:22px}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:min(92vw,480px);text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.sync.busy svg.i{animation:none}}
@media (max-width:359px){.hero .val{font-size:60px}.fld.t{grid-column:span 3}}
</style>
</head>
<style>
#boot{display:none}
html.booting #boot{display:block;position:fixed;inset:0;z-index:9999;background:#0b0d08;transition:opacity .6s ease}
#boot.out{display:block;position:fixed;inset:0;z-index:9999;background:#0b0d08;opacity:0;pointer-events:none;transition:opacity .6s ease}
#boot canvas{width:100%;height:100%;display:block}
</style>
<body>
<div id="boot" aria-hidden="true"><canvas></canvas></div>
<script>/* Arranque animado: al abrir la app instalada (o con #boot); nunca si se pide menos movimiento */
(function(){try{var st=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,forz=/[#&]boot\b/.test(location.hash);
if((st||forz)&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!/[#&]conectar=/.test(location.hash)||forz)document.documentElement.classList.add('booting');
if(/[#&]bootmanual\b/.test(location.hash))window.__bootManual=1;}catch(e){}})();</script>
<header class="top">
  <div class="bar">
    <div class="brand">LOGBOOK</div>

const pad2=n=>String(n).padStart(2,'0');
const hm=m=>`${Math.floor(m/60)}:${pad2(Math.round(m)%60)}`;
function parseHM(s){
  s=String(s==null?'':s).trim().replace(',','.');
  if(!s) return NaN;
  const m=s.match(/^(\d{1,4}):(\d{1,2})(?::\d{1,2})?$/);
  if(m){ const mm=+m[2]; if(mm>59) return NaN; return +m[1]*60+mm; }
  if(/^\d+(\.\d+)?$/.test(s)) return Math.round(parseFloat(s)*60);
  return NaN;
}
const dayNum=iso=>Math.floor(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))/864e5);
const isoFromDayNum=n=>new Date(n*864e5).toISOString().slice(0,10);
const diffDays=(a,b)=>dayNum(a)-dayNum(b);
const addDays=(iso,n)=>isoFromDayNum(dayNum(iso)+n);
const serialToISO=n=>isoFromDayNum(Math.floor(n)-25569);
const fmtDate=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`:'';
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isSim=f=>String(f.mision||'').toUpperCase()==='SIMULADOR';

function parseDateAny(v){
  if(v==null||v==='') return '';
  if(typeof v==='number') return v>20000?serialToISO(v):'';
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${pad2(+m[2])}-${pad2(+m[1])}`; }
  if(/^\d{5}(\.\d+)?$/.test(s)) return serialToISO(parseFloat(s));
  return '';
}
const normH=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
const FIELD={FECHA:'fecha',TIPO:'tipo',MATRICULA:'matricula',ROLL:'rol',ROL:'rol',MISION:'mision',CLAVE:'mision',HORAS:'horas',VUELO:'vuelo',TRIPULACION:'tripulacion',ZONAAERODROMO:'zona',ZONA:'zona',OBSERVACIONES:'obs'};

function tableToFlights(header,rows){
  const map={};
  header.forEach((h,i)=>{const k=FIELD[normH(h)]; if(k&&!(k in map)) map[k]=i;});
  if(map.fecha==null||map.horas==null) throw new Error('No encuentro las columnas FECHA y HORAS en la fila de títulos.');
  const out=[]; let skipped=0;
  for(const r of rows){
    if(!r||r.every(v=>v===''||v==null)) continue;
    const date=parseDateAny(r[map.fecha]);
    const raw=r[map.horas];
    const min=typeof raw==='number'?Math.round(raw*1440):parseHM(raw);
    if(!date||!(min>0)){skipped++;continue;}
    const g=k=>map[k]==null?'':String(r[map[k]]==null?'':r[map[k]]).trim();
    out.push({id:uid(),date,tipo:g('tipo'),matricula:g('matricula'),rol:g('rol').toUpperCase(),mision:g('mision').toUpperCase(),min,vuelo:g('vuelo').toUpperCase()==='IFR'?'IFR':'VFR',tripulacion:g('tripulacion'),zona:g('zona'),obs:g('obs')});
  }
  return {flights:out,skipped};
}

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const d=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===d){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

const xmlUnesc=s=>s.replace(/&#x([0-9a-f]+);/gi,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(+n)).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
async function inflateRaw(u8){
  const ds=new DecompressionStream('deflate-raw');
  const stream=new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), dec=new TextDecoder();
  let e=buf.byteLength-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('El archivo no es un .xlsx válido.');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    const start=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    files[name]={method,data:u8.subarray(start,start+csize)};
    p+=46+nl+el+cl;
  }
  return files;
}
async function fileText(files,name){
  const f=files[name]; if(!f) return null;
  const d=f.method===0?f.data:await inflateRaw(f.data);
  return new TextDecoder().decode(d);
}
const colIdx=L=>L.split('').reduce((a,c)=>a*26+c.charCodeAt(0)-64,0)-1;
const textsOf=x=>[...x.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(m=>xmlUnesc(m[1])).join('');
async function readXlsx(buf){
  const files=await unzip(buf);
  const wbx=await fileText(files,'xl/workbook.xml');
  if(!wbx) throw new Error('El archivo no parece un libro de Excel.');
  const sheets=[...wbx.matchAll(/<sheet\b[^>]*>/g)].map(m=>({name:xmlUnesc((m[0].match(/name="([^"]*)"/)||[])[1]||''),rid:(m[0].match(/r:id="([^"]*)"/)||[])[1]}));
  const pick=sheets.find(s=>normH(s.name)==='HORAS')||sheets[0];
  if(!pick) throw new Error('El libro no tiene hojas.');
  const rels=await fileText(files,'xl/_rels/workbook.xml.rels')||'';
  let target='worksheets/sheet1.xml';
  for(const m of rels.matchAll(/<Relationship\b[^>]*>/g)){
    if((m[0].match(/Id="([^"]*)"/)||[])[1]===pick.rid){ target=(m[0].match(/Target="([^"]*)"/)||[])[1]; break; }
  }
  const path=target.startsWith('/')?target.slice(1):'xl/'+target;
  const sx=await fileText(files,path); if(!sx) throw new Error('No he podido leer la hoja '+pick.name+'.');
  const ssx=await fileText(files,'xl/sharedStrings.xml');
  const sst=ssx?[...ssx.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)].map(m=>textsOf(m[1])):[];
  const grid=new Map();
  for(const m of sx.matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
    const attrs=m[1], body=m[2]||'';
    const ref=(attrs.match(/\br="([A-Z]+)(\d+)"/)||[]); if(!ref[1]) continue;
    const t=(attrs.match(/\bt="([^"]*)"/)||[])[1]||'n';
    const v=(body.match(/<v>([\s\S]*?)<\/v>/)||[])[1];
    let val='';
    if(t==='s') val=v==null?'':(sst[+v]??'');
    else if(t==='inlineStr') val=textsOf(body);
    else if(t==='str') val=v==null?'':xmlUnesc(v);
    else if(t==='b'||t==='e') val='';
    else val=v==null||v===''?'':Number(v);
    const r=+ref[2]; if(!grid.has(r)) grid.set(r,[]);
    grid.get(r)[colIdx(ref[1])]=val;
  }
  const nums=[...grid.keys()].sort((a,b)=>a-b);
  let hr=nums.find(r=>(grid.get(r)||[]).some(v=>normH(v)==='FECHA'));
  if(hr==null) throw new Error('No encuentro la fila de títulos con la columna FECHA.');
  const header=Array.from(grid.get(hr).slice(0,10),v=>v==null?'':v);
  const rows=nums.filter(r=>r>hr).map(r=>Array.from((grid.get(r)||[]).slice(0,10),v=>v==null?'':v));
  return {sheet:pick.name,header,rows};
}

/* ---------- Sincronización con la Hoja de Google ---------- */
function syncConfigured(){ return !!(S.sync && S.sync.url && S.sync.token); }
const pend=()=>(S.sync&&S.sync.pendingOps)||[];
async function call(fn){
  net.busy++; updateSync();
  try{ return await fn(); } finally{ net.busy--; updateSync(); }
}
function apiGet(action){ return call(async()=>{
  const u=new URL(S.sync.url);
  u.searchParams.set('action',action);
  u.searchParams.set('token',S.sync.token);
  u.searchParams.set('_',Date.now());
  const r=await fetch(u.toString(),{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j.ok){ const e=new Error(j.error||'error'); e.server=true; throw e; }
  return j;
}); }
function apiPost(action,payload,op){ return call(async()=>{
  const r=await fetch(S.sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.sync.token,action,payload:payload||{},op:op||uid()})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j.ok){ const e=new Error(j.error||'error'); e.server=true; throw e; }
  net.okAt=Date.now(); setTimeout(updateSync,2400);
  return j;
}); }
function remoteToLocal(r){
  return {id:uid(),rowId:r.rowId,ref:r.ref||'',date:r.fecha,tipo:r.tipo||'',matricula:r.matricula||'',rol:r.rol||'',mision:r.clave||'',min:r.min||0,vuelo:r.vuelo||'',tripulacion:r.tripulacion||'',zona:r.zona||'',obs:r.obs||'',ciclos:r.ciclos||0,heridos:r.heridos||0,fallecidos:r.fallecidos||0};
}
function localToRemote(f){
  return {rowId:f.rowId,ref:f.ref||undefined,fecha:f.date,tipo:f.tipo||'',matricula:f.matricula||'',rol:f.rol||'',clave:f.mision||'',min:f.min||0,vuelo:f.vuelo||'',tripulacion:f.tripulacion||'',zona:f.zona||'',obs:f.obs||'',ciclos:f.ciclos||0,heridos:f.heridos||0,fallecidos:f.fallecidos||0};
}
const sortForm=a=>[...a].sort((x,y)=>String(x.fecha||'').localeCompare(String(y.fecha||'')));
async function syncPullAll(){
  const res=await apiGet('todo');
  // Lo que aún no ha subido (añadidos o ediciones hechas sin cobertura) se conserva encima de lo que llega.
  const ops=pend().filter(o=>o.op==='add'||o.op==='update');
  const mine=ops.map(o=>S.flights.find(f=>f.id===o.localId)).filter(Boolean);
  const dels=new Set(pend().filter(o=>o.op==='delete').map(o=>o.ref||('#'+o.rowId)));
  let list=(res.flights||[]).map(remoteToLocal).filter(f=>!dels.has(f.ref)&&!dels.has('#'+f.rowId));
  for(const m of mine){
    const i=m.rowId?list.findIndex(f=>(m.ref&&f.ref===m.ref)||f.rowId===m.rowId):-1;
    if(i>=0) list[i]=m; else list.push(m);
  }
  S.flights=list;
  S.rules=[];
  if(Array.isArray(res.claves)) S.claves=res.claves;
  if(Array.isArray(res.caducidades)) S.cad=res.caducidades;
  if(Array.isArray(res.formacion)&&!pend().some(o=>o.op==='form')) S.form=sortForm(res.formacion);
  S.demo=false;
  S.sync.lastOk=Date.now();
  save();
  return res;
}
async function connectSync(url,token){
  S.sync={url,token,pendingOps:[]};

  catch(e){ S.sync={url:'',token:'',pendingOps:[]}; save(); throw e; }
}
function disconnectSync(){ S.sync={url:'',token:'',pendingOps:[]}; net.err=''; save(); }
function queuePending(o){

  S.sync.pendingOps.push(o);
  save(); updateSync();
}
async function drainPending(){
  if(!syncConfigured()) return;
  const q=[...pend()]; if(!q.length) return;
  let rest=[];
  for(let i=0;i<q.length;i++){
    const op=q[i];
    try{
      if(op.op==='delete'){ if(op.rowId) await apiPost('delete',{rowId:op.rowId,fecha:op.fecha,ref:op.ref||undefined},op.opId); }
      else if(op.op==='form'){ const r=await apiPost('setFormacion',{items:S.form||[]},op.opId); if(Array.isArray(r.formacion)) S.form=sortForm(r.formacion); }
      else{
        const f=S.flights.find(x=>x.id===op.localId);
        if(f){
          const res=await apiPost(f.rowId?'update':'add',localToRemote(f),op.opId);
          if(res.flight){ f.rowId=res.flight.rowId||f.rowId; f.ref=res.flight.ref||''; }
        }
      }
    }catch(e){
      if(e.server) toast('Tu hoja no aceptó un cambio pendiente: '+e.message);
      else { rest=q.slice(i); break; }   // sin red: se conserva el orden y se reintenta luego
    }
    S.sync.pendingOps=q.slice(i+1); save();
  }
  S.sync.pendingOps=rest; save();
}
const typing=()=>{ const a=document.activeElement; return tab()==='anadir'||$('#modal').classList.contains('on')||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); };
let syncing=false;
async function syncAll(force){
  if(!syncConfigured()||syncing) return;
  syncing=true;
  try{ await drainPending(); await syncPullAll(); net.err=''; }
  catch(e){ net.err=navigator.onLine?e.message:''; }
  syncing=false;
  if(force||!typing()) render(); else updateSync();
}
function syncState(){
  if(!syncConfigured()) return {c:'off',i:IC.off,t:''};
  const np=pend().length;
  if(net.busy) return {c:'busy',i:IC.spin,t:'Sincronizando con tu hoja…'};
  if(!navigator.onLine) return {c:'warn',i:IC.up,n:np,t:np?`Sin conexión. ${np} cambio${np>1?'s':''} guardado${np>1?'s':''} en el móvil; se subirá${np>1?'n':''} solo${np>1?'s':''} al recuperar cobertura.`:'Sin conexión. Estás viendo los últimos datos guardados.'};
  if(np) return {c:'warn',i:IC.up,n:np,t:`${np} cambio${np>1?'s':''} pendiente${np>1?'s':''} de subir a tu hoja. Se reintenta solo.`};
  if(net.err) return {c:'err',i:IC.bang,t:'No se pudo sincronizar con tu hoja: '+net.err};
  if(Date.now()-net.okAt<2200) return {c:'ok',i:IC.ok,t:'Guardado en tu hoja'};
  return {c:'idle',i:'',t:''};
}
function updateSync(){
  const el=$('#sync'); if(!el) return;
  const s=syncState();
  el.className='sync '+s.c;
  el.innerHTML=(s.i?ico(s.i):'')+(s.n?`<span>${s.n}</span>`:'');
  el.dataset.tip=s.t;

/* ---------- cálculos ---------- */
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function types(){
  const seen=[...new Set(S.flights.map(f=>f.tipo).filter(Boolean))];
  return [...TYPE_ORDER.filter(t=>seen.includes(t)),...seen.filter(t=>!TYPE_ORDER.includes(t)).sort()];
}
const colorOf=t=>TYPE_COLOR[t]||'var(--a4)';
function haceTxt(n){ return n===0?'hoy':n===1?'ayer':n<0?`en ${-n} días`:`hace ${n} días`; }
function lapso(iso,today){
  let m=(+today.slice(0,4)-+iso.slice(0,4))*12+(+today.slice(5,7)-+iso.slice(5,7)); if(today.slice(8,10)<iso.slice(8,10)) m--;
  if(m<0) return '';
  if(m<1) return haceTxt(diffDays(today,iso));
  const y=Math.floor(m/12), r=m%12;
  return 'hace '+[y?`${y} año${y>1?'s':''}`:'',r?`${r} mes${r>1?'es':''}`:''].filter(Boolean).join(' y ');
}
function winMin(list,today,days){ const from=addDays(today,-days+1); return sum(list.filter(f=>f.date>=from&&f.date<=today),f=>f.min); }
function lastOf(list){ return list.reduce((a,f)=>f.date>a?f.date:a,''); }
function claveDesc(k){
  k=String(k||'').toUpperCase().trim(); if(!k) return '';
  const c=(S.claves||[]).find(x=>String(x.clave).toUpperCase().trim()===k);
  return (c&&c.descripcion)||MISSION_NAMES[k]||'';
}
const nInt=v=>{ const n=parseInt(v,10); return isFinite(n)&&n>0?n:0; };
const rescatados=f=>nInt(f.heridos)+nInt(f.fallecidos);
const plural=(n,s,p)=>`${n} ${n===1?s:(p||s+'s')}`;
function addMonthsISO(iso,m){ const y=+iso.slice(0,4), mo=+iso.slice(5,7)-1+m, d=+iso.slice(8,10); const t=new Date(Date.UTC(y,mo,1)); const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate(); return `${t.getUTCFullYear()}-${pad2(t.getUTCMonth()+1)}-${pad2(Math.min(d,last))}`; }
const monName=k=>`${MESES_L[+k.slice(5,7)-1]} ${k.slice(0,4)}`;
function months12(real,today){
  const out=[]; const y=+today.slice(0,4), m=+today.slice(5,7);
  for(let i=11;i>=0;i--){
    let mm=m-i, yy=y; while(mm<1){ mm+=12; yy--; }
    const key=`${yy}-${pad2(mm)}`, a=real.filter(f=>f.date.startsWith(key));
    out.push({key,lbl:MESES[mm-1][0],min:sum(a,f=>f.min),n:a.length});
  }
  return out;
}
function cimaState(today){
  const c=(S.cad||[]).find(x=>x.concepto===CIMA);
  if(!c||!c.ultima) return c?{st:'warn',none:true}:null;
  const vence=addMonthsISO(c.ultima,c.meses||12), left=diffDays(vence,today), tot=Math.max(1,diffDays(vence,c.ultima));
  return {st:left<0?'late':left<=60?'warn':'ok',left,vence,ultima:c.ultima,pct:Math.max(0,Math.min(100,left/tot*100))};
}
const habDe=t=>(S.form||[]).find(x=>x.aeronave===t&&x.fecha);

function barRows(items){
  const max=Math.max(1,...items.map(i=>i.min));

}

      <div class="ends"><span>Pasado el ${fmtDate(cs.ultima)}</span><span>${cs.left<0?'Venció':'Vence'} el ${fmtDate(cs.vence)}</span></div>
      <div class="row" style="margin-top:14px"><button class="small" data-act="cad-edit" data-c="${CIMA}">Cambiar fecha</button></div></section>`;
  else if(cs) cima=`<section class="card valid warn"><header><h2>Reconocimiento médico CIMA</h2><span class="pill">Sin fecha</span></header><button class="small" data-act="cad-edit" data-c="${CIMA}">Poner fecha</button></section>`;
  else cima=`<section class="card"><header><h2>Reconocimiento médico CIMA</h2></header><div class="hint">${syncConfigured()?'No aparece en la pestaña CADUCIDADES de tu hoja.':'Conecta tu hoja de Google en Datos para controlar la caducidad.'}</div></section>`;
  const sims=S.flights.filter(isSim);
  const kv=(n,iso,c)=>`<div class="kv"><div><div class="a">${esc(n)}</div><div class="b">${iso?`${fmtDate(iso)}, ${lapso(iso,today)}`:'sin fecha'}</div></div>${c?`<button class="small" data-act="cad-edit" data-c="${esc(c)}">Cambiar</button>`:''}</div>`;
  const others=['Entrenamiento aeromédico (CIMA)','Supervivencia en el mar'].map(c=>{ const x=cad.find(y=>y.concepto===c); return x?kv(c.replace(' (CIMA)',''),x.ultima,c):''; }).join('')
    +types().map(t=>({t,l:lastOf(sims.filter(f=>f.tipo===t))})).filter(x=>x.l).map(x=>kv('Simulador '+x.t,x.l,'')).join('');
  return `
  ${cima}
  <section class="card"><header><h2>Última vez</h2><span class="hint">informativo, sin avisos</span></header>
    ${others||'<div class="hint">Sin datos.</div>'}</section>
  <section class="card"><header><h2>Título y habilitaciones</h2></header>${tit?`<p class="hint" style="margin:-6px 0 16px">Piloto desde el ${fmtDate(tit.fecha)}, ${lapso(tit.fecha,today)}.</p>`:''}
    ${form.length?`<ol class="tl">${form.map((x,i)=>`<li class="${x.tipo==='TÍTULO'?'tit':''}">
      <div class="when">${x.fecha?fmtDate(x.fecha):'sin fecha'}${x.fecha?`<small>${lapso(x.fecha,today)}</small>`:''}</div>
      <div class="what">${esc(x.nombre)}</div>
      <div class="kind">${esc(x.tipo==='TÍTULO'?'Título':x.tipo==='HABILITACIÓN'?'Habilitación de tipo':'Curso')}</div>
      ${x.detalle?`<div class="det">${esc(x.detalle)}</div>`:''}
      <button class="small" data-act="form-edit" data-i="${i}">Editar</button></li>`).join('')}</ol>`
      :'<div class="hint">Anota aquí tu título de piloto y las habilitaciones de tipo, con su fecha.</div>'}
    <div class="row" style="margin-top:16px"><button data-act="form-edit" data-i="-1">Añadir título, habilitación o curso</button></div>
    <p class="hint" style="margin-bottom:0">Las horas de los cursos se guardan como dato de formación y no se suman a tus horas de vuelo.</p>
  </section>`;
}

/* ---------- navegación ---------- */
const VIEWS={resumen:viewResumen,piloto:viewPiloto,vuelos:viewVuelos,anadir:viewAnadir,datos:viewDatos};
function tab(){ let h=location.hash.slice(1); if(h==='vigencias') h='piloto'; return VIEWS[h]?h:'resumen'; }
function render(){
  const t=tab();
  document.querySelectorAll('#nav a').forEach(a=>{ if(a.dataset.tab===t) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#app').innerHTML=VIEWS[t]();
  updateSync();
}
window.addEventListener('hashchange',()=>{ if(/^#conectar=/.test(location.hash)) return; if(tab()!=='anadir') editingId=null; render(); window.scrollTo(0,0); });

/* ---------- eventos ---------- */
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='f-mision'){ const el=$('#f-misdesc'); if(el) el.textContent=claveDesc(e.target.value); markQuick('f-mision',e.target.value.toUpperCase()); return; }
  if(id==='f-tipo'||id==='f-mat'){ markQuick(id,e.target.value); return; }
  if(id==='q'){ V.q=e.target.value; const pos=e.target.selectionStart; render(); const el=$('#q'); el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} }
});
document.addEventListener('change',e=>{ if(e.target.id==='file'&&e.target.files[0]) onFile(e.target.files[0]); });
function markQuick(target,val){ document.querySelectorAll(`[data-set="${target}"]`).forEach(b=>b.classList.toggle('on',b.dataset.v===val)); }
let submitter=null;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('article.fl')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('click',async e=>{
  const st=e.target.closest('[data-step]');
  if(st){ const inp=$('#'+st.dataset.for); inp.value=Math.max(0,nInt(inp.value)+(+st.dataset.step))||''; return; }
  const qs=e.target.closest('[data-set]');
  if(qs){ const inp=$('#'+qs.dataset.set); inp.value=qs.dataset.v; markQuick(qs.dataset.set,qs.dataset.v); if(qs.dataset.set==='f-mision'){ const el=$('#f-misdesc'); if(el) el.textContent=claveDesc(qs.dataset.v); } return; }
  const sb=e.target.closest('button[type=submit]'); if(sb) submitter=sb.dataset.then||'list';
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==='fl-open'){ if(e.target.closest('.more')) return; V.open=V.open===id?null:id; render(); }
  else if(act==='pick-month'){ V.mon=b.dataset.k; render(); }
  else if(act==='see-month'){ V.fm=b.dataset.k; V.ft=''; V.fy=''; V.q=''; }
  else if(act==='f-type'){ V.ft=b.dataset.v; render(); }
  else if(act==='f-year'){ V.fy=V.fy===b.dataset.v?'':b.dataset.v; render(); }
  else if(act==='f-month'){ V.fm=''; render(); }
  else if(act==='sync-info'){ if(!syncConfigured()) location.hash='datos'; else if(b.dataset.tip) toast(b.dataset.tip); if(syncConfigured()&&!net.busy&&navigator.onLine&&(pend().length||net.err)) syncAll(); }
  else if(act==='theme'){ S.theme=b.dataset.v; save(); applyTheme(); render(); }
  else if(act==='edit'){ editingId=id; if(tab()==='anadir') render(); else location.hash='anadir'; }
  else if(act==='cancel-edit'){ editingId=null; location.hash='vuelos'; }
  else if(act==='del'){ pending=id; const f=S.flights.find(x=>x.id===id); modal(`<h2>¿Borrar este vuelo?</h2><div>${fmtDate(f.date)}, ${esc(f.tipo)}, ${esc(f.mision)}, ${hm(f.min)} h</div><div class="row"><button class="danger wide" data-act="del-ok">Borrar vuelo</button><button data-act="modal-x">Cancelar</button></div>`); }
  else if(act==='del-ok'){
    const f=S.flights.find(x=>x.id===pending); if(!f){ closeModal(); return; }
    S.flights=S.flights.filter(x=>x.id!==f.id);
    S.sync.pendingOps=pend().filter(o=>o.localId!==f.id);
    save(); closeModal(); render(); toast('Vuelo borrado');
    if(syncConfigured()&&f.rowId){
      const opId=uid();
      try{ await apiPost('delete',{rowId:f.rowId,fecha:f.date,ref:f.ref||undefined},opId); await syncAll(); }
      catch(ex){
        if(ex.server){ toast('Tu hoja no aceptó el borrado: '+ex.message); await syncAll(); }
        else queuePending({op:'delete',rowId:f.rowId,fecha:f.date,ref:f.ref||'',opId});
      }
    }
  }
  else if(act==='modal-x') closeModal();
  else if(act==='save-json') saveFile('libro-de-vuelo.json',JSON.stringify({version:2,flights:S.flights,form:S.form||[]},null,1));
  else if(act==='save-csv') saveFile('libro-de-vuelo.csv',toCSV());
  else if(act==='copy-json') copyText(JSON.stringify({version:2,flights:S.flights,form:S.form||[]}));
  else if(act==='wipe'){ modal(`<h2>¿Borrar los datos de este dispositivo?</h2><div>${syncConfigured()?'La app se desconecta y se vacía. Tu hoja de Google conserva todos los vuelos; podrás volver a conectar con tu enlace.':'Se eliminan todos los vuelos guardados en este navegador. No se puede deshacer.'}</div>${pend().length?`<div class="banner late">Hay ${plural(pend().length,'cambio')} sin subir a tu hoja que se perderá${pend().length>1?'n':''}.</div>`:''}<div class="row"><button class="danger wide" data-act="wipe-ok">Borrar datos</button><button data-act="modal-x">Cancelar</button></div>`); }
  else if(act==='wipe-ok'){ S={flights:[],rules:[],demo:false,sync:{url:'',token:'',pendingOps:[]},claves:[],cad:[],form:[],theme:S.theme}; net.err=''; save(); closeModal(); render(); toast('Datos borrados de este dispositivo'); }
  else if(act==='sync-connect'){
    const url=($('#sy-url')||{}).value?.trim(), tok=($('#sy-tok')||{}).value?.trim();
    const errEl=$('#sy-err');
    if(!url||!tok){ errEl.textContent='Completa la dirección y la clave.'; return; }
    if(!/^https:\/\//.test(url)){ errEl.textContent='La dirección debe empezar por https://'; return; }
    errEl.textContent='Conectando…';
    try{ await connectSync(url,tok); render(); toast(`Conectado: ${plural(S.flights.length,'vuelo')}`); }
    catch(ex){ render(); const e2=$('#sy-err'); if(e2) e2.textContent='No se pudo conectar: '+ex.message; }
  }
  else if(act==='sync-now'){ await syncAll(true); toast(net.err?'No se pudo sincronizar: '+net.err:navigator.onLine?'Sincronizado':'Sin conexión'); }
  else if(act==='sync-off'){ if(pend().length){ modal(`<h2>Hay cambios sin subir</h2><div>Si desconectas ahora, ${plural(pend().length,'cambio')} no llegará${pend().length>1?'n':''} a tu hoja.</div><div class="row"><button class="danger wide" data-act="sync-off-ok">Desconectar igualmente</button><button data-act="modal-x">Cancelar</button></div>`); } else { disconnectSync(); render(); toast('Desconectado de tu hoja'); } }
  else if(act==='sync-off-ok'){ disconnectSync(); closeModal(); render(); toast('Desconectado de tu hoja'); }
  else if(act==='cad-edit'){
    const c=b.dataset.c; const x=(S.cad||[]).find(y=>y.concepto===c)||{};
    pending=c;
    modal(`<h2>${esc(c)}</h2><div class="fld"><label for="cad-d">Fecha de la última vez</label><input id="cad-d" type="date" value="${esc(x.ultima||todayISO())}" max="${todayISO()}"></div><div class="err" id="cad-err" role="alert"></div><div class="row"><button class="primary wide" data-act="cad-ok">Guardar fecha</button><button data-act="modal-x">Cancelar</button></div>`);
  }
  else if(act==='cad-ok'){
    const c=pending, d=($('#cad-d')||{}).value, er=m=>{ const el=$('#cad-err'); if(el) el.textContent=m; };
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d||'')) return er('Pon una fecha.');
    if(!syncConfigured()) return er('Conecta tu hoja de Google para guardar esta fecha.');
    er('Guardando…');
    try{ const r=await apiPost('setCaducidad',{concepto:c,fecha:d}); S.cad=r.caducidades||S.cad; save(); closeModal(); render(); toast('Fecha guardada'); }
    catch(ex){ er(ex.server?'Tu hoja no aceptó la fecha: '+ex.message:'Sin conexión. Inténtalo cuando tengas cobertura.'); }
  }
  else if(act==='form-edit'){
    const i=+b.dataset.i, list=sortForm(S.form||[]), x=i>=0?list[i]:{tipo:'HABILITACIÓN',nombre:'',fecha:'',aeronave:'',detalle:''};
    V.fi=i;
    const aer=[...new Set([...TYPE_ORDER.slice(1),...types(),x.aeronave].filter(Boolean))];
    modal(`<h2>${i>=0?'Editar':'Añadir'}</h2>
      <div class="fld"><span class="lab">Tipo</span><div class="seg">${FORM_TIPOS.map(t=>`<button type="button" class="${t===x.tipo?'on':''}" data-set="fm-tipo" data-v="${t}">${t[0]+t.slice(1).toLowerCase()}</button>`).join('')}</div><input type="hidden" id="fm-tipo" value="${esc(x.tipo)}"></div>
      <div class="fld"><label for="fm-nombre">Nombre</label><input id="fm-nombre" value="${esc(x.nombre)}" autocomplete="off" placeholder="H135 P3H, curso…"></div>
      <div class="grid"><div class="fld h"><label for="fm-fecha">Fecha</label><input id="fm-fecha" type="date" value="${esc(x.fecha)}"></div>
      <div class="fld h"><label for="fm-aero">Aeronave (si es habilitación)</label><select id="fm-aero"><option value="">Ninguna</option>${aer.map(t=>`<option${t===x.aeronave?' selected':''}>${esc(t)}</option>`).join('')}</select></div></div>
      <div class="fld"><label for="fm-det">Detalle</label><textarea id="fm-det" rows="4">${esc(x.detalle)}</textarea></div>
      <div class="err" id="fm-err" role="alert"></div>
      <div class="row"><button class="primary wide" data-act="form-ok">Guardar</button>${i>=0?'<button class="danger" data-act="form-del">Borrar</button>':''}<button data-act="modal-x">Cancelar</button></div>`);
  }
  else if(act==='form-ok'||act==='form-del'){
    const list=sortForm(S.form||[]);
    if(act==='form-del') list.splice(V.fi,1);
    else{
      const rec={tipo:$('#fm-tipo').value,nombre:$('#fm-nombre').value.trim(),fecha:$('#fm-fecha').value,aeronave:$('#fm-aero').value,detalle:$('#fm-det').value.trim()};
      if(!rec.nombre){ $('#fm-err').textContent='Escribe el nombre.'; return; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(rec.fecha)){ $('#fm-err').textContent='Pon la fecha.'; return; }
      if(V.fi>=0) list[V.fi]=rec; else list.push(rec);
    }
    S.form=sortForm(list); save(); closeModal(); render(); toast(act==='form-del'?'Borrado':'Guardado');
    if(syncConfigured()){
      const opId=uid();
      try{ const r=await apiPost('setFormacion',{items:S.form},opId); if(Array.isArray(r.formacion)){ S.form=sortForm(r.formacion); save(); } }
      catch(ex){ if(ex.server) toast('Tu hoja no aceptó el cambio: '+ex.message); else queuePending({op:'form',opId}); }
    }
  }
  else if(act==='imp-replace'||act==='imp-add'){
    const inc=pending.flights;
    if(act==='imp-replace'||S.demo){ S.flights=[]; leaveDemo(); }
    const key=f=>[f.date,f.tipo,f.matricula,f.rol,f.mision,f.min,f.vuelo,f.zona,f.obs].join('|');
    const have=new Set(S.flights.map(key)); let added=0;
    inc.forEach(f=>{ if(!have.has(key(f))){ S.flights.push(f); have.add(key(f)); added++; } });
    if(Array.isArray(pending.form)&&pending.form.length&&!(S.form||[]).length) S.form=sortForm(pending.form);
    S.demo=false; save(); closeModal(); location.hash='resumen'; render(); toast(`${plural(added,'vuelo')} importado${added===1?'':'s'}`);
  }
});
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

document.addEventListener('submit',e=>{ e.preventDefault(); if(e.target.id==='flightform') onFlightSubmit(); });
async function onFlightSubmit(){
  const g=id=>$('#'+id).value.trim(), err=m=>{ $('#f-err').textContent=m; };
  const date=g('f-date'), min=parseHM(g('f-horas'));
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err('Pon la fecha.');
  if(!(min>=0)) return err('Escribe las horas como H:MM, por ejemplo 1:25.');
  if(!g('f-tipo')) return err('Elige la aeronave.');
  if(!g('f-mision')) return err('Elige la clave de servicio (o SIMULADOR).');
  const rec={date,tipo:g('f-tipo'),matricula:g('f-mat'),rol:g('f-rol'),mision:g('f-mision').toUpperCase(),min,vuelo:g('f-vuelo'),tripulacion:g('f-trip'),zona:g('f-zona'),obs:g('f-obs'),ciclos:nInt(g('f-ciclos')),heridos:nInt(g('f-her')),fallecidos:nInt(g('f-fal'))};
  let f, wasEdit=false;
  if(editingId){ const i=S.flights.findIndex(x=>x.id===editingId); if(i<0){ editingId=null; return err('Ese vuelo ya no existe. Vuelve a la lista.'); } S.flights[i]=Object.assign({},S.flights[i],rec); f=S.flights[i]; wasEdit=true; editingId=null; }
  else { leaveDemo(); f=Object.assign({id:uid()},rec); S.flights.push(f); }
  save(); toast(wasEdit?'Cambios guardados':'Vuelo guardado');
  V.open=null;
  if(submitter==='again'&&!wasEdit){ render(); window.scrollTo(0,0); const h=$('#f-horas'); if(h) h.focus(); } else location.hash='vuelos';
  if(syncConfigured()){
    if(pend().some(o=>o.localId===f.id)) return;       // ya está en cola: subirá con los datos nuevos
    const opId=uid();
    try{
      const res=await apiPost(f.rowId?'update':'add',localToRemote(f),opId);
      if(res.flight){ f.rowId=res.flight.rowId||f.rowId; f.ref=res.flight.ref||''; save(); }
      if(!typing()) render();
    }catch(ex){
      if(ex.server){ toast('Tu hoja no aceptó el cambio: '+ex.message); await syncAll(); }
      else queuePending({op:f.rowId?'update':'add',localId:f.id,opId});
    }
  }
}

/* ---------- importar / exportar ---------- */
async function onFile(file){
  const err=m=>{ const el=$('#imp-err'); if(el) el.textContent=m; };
  err('');
  try{
    const name=file.name.toLowerCase(); let res;
    if(name.endsWith('.xlsx')){ const x=await readXlsx(await file.arrayBuffer()); res=tableToFlights(x.header,x.rows); res.note=`Hoja «${x.sheet}»`; }
    else if(name.endsWith('.json')){
      const o=JSON.parse(await file.text());
      if(!o||!Array.isArray(o.flights)) throw new Error('El archivo no es una copia de este libro de vuelo.');
      res={flights:o.flights.filter(f=>f&&f.date&&f.min>=0).map(f=>Object.assign({},f,{id:uid(),rowId:undefined,ref:undefined})),skipped:0,form:o.form||[],note:'Copia de seguridad'};
    } else { const rows=parseCSV(await file.text()); res=tableToFlights(rows[0]||[],rows.slice(1)); res.note='CSV'; }
    if(!res.flights.length) throw new Error('No hay ningún vuelo válido en el archivo.');
    pending=res;
    const ds=res.flights.map(f=>f.date).sort(), tot=sum(res.flights.filter(f=>!isSim(f)),f=>f.min);
    modal(`<h2>Importar ${plural(res.flights.length,'vuelo')}</h2><div>${esc(res.note)}, del ${fmtDate(ds[0])} al ${fmtDate(ds[ds.length-1])}.<br>Vuelo real: <b class="n">${hm(tot)} h</b>${res.skipped?`<br><span class="hint">${plural(res.skipped,'fila')} sin fecha u horas válidas, omitida${res.skipped>1?'s':''}.</span>`:''}</div>
      <div class="hint">${S.demo||!S.flights.length?'':'Reemplazar borra los vuelos actuales; Añadir los conserva y salta los repetidos.'}</div>
      <div class="row"><button class="primary wide" data-act="imp-replace">${S.demo||!S.flights.length?'Importar':'Reemplazar mis vuelos'}</button>${S.demo||!S.flights.length?'':'<button data-act="imp-add">Añadir a los actuales</button>'}<button data-act="modal-x">Cancelar</button></div>`);
  }catch(ex){ err('No se pudo importar: '+ex.message); }
  const fi=$('#file'); if(fi) fi.value='';
}
function toCSV(){
  const q=v=>{ v=String(v==null?'':v); return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const head=['FECHA','TIPO','MATRÍCULA','ROL','CLAVE','HORAS','VUELO','TRIPULACIÓN','ZONA-AERÓDROMO','OBSERVACIONES','CICLOS GRÚA','HERIDOS','FALLECIDOS'];
  const body=[...S.flights].sort((a,b)=>a.date.localeCompare(b.date)).map(f=>[fmtDate(f.date),f.tipo,f.matricula,f.rol,f.mision,hm(f.min),f.vuelo,f.tripulacion,f.zona,f.obs,nInt(f.ciclos)||'',nInt(f.heridos)||'',nInt(f.fallecidos)||''].map(q).join(';'));
  return '﻿'+[head.join(';'),...body].join('\r\n');
}
async function saveFile(name,data){
  try{
    const type=name.endsWith('.json')?'application/json':'text/csv;charset=utf-8';
    const blob=new Blob([data],{type});
    const file=new File([blob],name,{type});
    if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:name}); return; }catch(e){ if(e&&e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Archivo generado');
  }catch(e){ noDl=true; toast('Aquí no se pueden guardar archivos. Usa Copiar al portapapeles.'); render(); }
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Copia en el portapapeles'); }
  catch(e){ modal(`<h2>Copia de seguridad</h2><div class="hint">Selecciona todo el texto y cópialo.</div><textarea id="bk" readonly rows="6">${esc(t)}</textarea><div class="row"><button data-act="modal-x">Cerrar</button></div>`); const b=$('#bk'); if(b){ b.focus(); b.select(); } }
}

/* ---------- arranque ---------- */
(function(){
  load(); applyTheme(); render();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(_){}
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').then(r=>{ try{ r.update(); }catch(_){} }).catch(()=>{});
  // Enlace de conexión de un toque: index.html#conectar=<base64 de {"u":url,"t":token}>
  // (lo que va tras # nunca se envía al servidor ni se guarda en GitHub)
  function tryConnectLink(){
    const mh=location.hash.match(/^#conectar=(.+)$/);
    if(!mh) return false;
    try{
      const c=JSON.parse(atob(decodeURIComponent(mh[1])));
      history.replaceState(null,'',location.pathname+location.search+'#resumen');
      if(c.u&&c.t){
        if(syncConfigured()&&S.sync.url===c.u&&S.sync.token===c.t){ render(); syncAll(true); return true; }
        toast('Conectando con tu hoja…');
        connectSync(c.u,c.t).then(()=>{ render(); toast(`Conectado: ${plural(S.flights.length,'vuelo')}`); })
          .catch(ex=>{ location.hash='datos'; render(); toast('No se pudo conectar: '+ex.message); });
        return true;
      }
    }catch(_){}
    render();
    return false;
  }
  window.addEventListener('hashchange',tryConnectLink);
  if(tryConnectLink()) return;
  syncAll();
})();
</script>
